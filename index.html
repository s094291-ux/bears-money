<!doctype html>

<head>

<title>🐻‘s Money</title>

<style>
:root{--bg:#f7f3ee;--card:#fffdf9;--text:#3f3934;--muted:#8d837a;--line:#e8dfd6;--accent:#9b806b;--green:#738b73;--red:#b47770;--shadow:0 10px 30px rgba(91,70,52,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}
.auth{min-height:100vh;display:grid;place-items:center;padding:24px}.auth-card{width:min(430px,100%);background:var(--card);padding:32px;border-radius:28px;box-shadow:var(--shadow)}
.brand{text-align:center;font-size:28px;font-weight:800;margin-bottom:8px}.sub{text-align:center;color:var(--muted);font-size:14px;margin-bottom:28px}
.tabs{display:flex;background:#f0e9e2;padding:4px;border-radius:14px;margin-bottom:20px}.tabs button{flex:1;padding:10px;border-radius:10px;background:transparent;color:var(--muted)}.tabs button.active{background:white;color:var(--text);box-shadow:0 2px 8px #0000000b}
label{display:block;font-size:13px;color:var(--muted);margin:14px 0 7px}.input,.select,.textarea{width:100%;border:1px solid var(--line);background:white;border-radius:12px;padding:12px;color:var(--text);outline:none}
.primary{width:100%;background:var(--accent);color:white;padding:13px;border-radius:13px;font-weight:700;margin-top:18px}.primary:disabled{opacity:.6;cursor:not-allowed}
.ghost{background:#eee7df;color:var(--text);padding:10px 14px;border-radius:11px}.danger{background:#f5e2df;color:#9d5b55;padding:9px 12px;border-radius:10px}
.app{min-height:100vh}.topbar{position:sticky;top:0;z-index:5;background:#f7f3eedf;backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
.topbrand{font-weight:800;font-size:20px}.user{font-size:12px;color:var(--muted);margin-right:8px}.layout{display:grid;grid-template-columns:220px 1fr;max-width:1250px;margin:auto}
.sidebar{padding:22px 14px;border-right:1px solid var(--line);min-height:calc(100vh - 65px)}.navbtn{width:100%;text-align:left;background:transparent;color:var(--muted);padding:12px;border-radius:12px;margin:2px 0}.navbtn.active,.navbtn:hover{background:#eee7df;color:var(--text)}
main{padding:24px;min-width:0}.page-title{font-size:25px;font-weight:800;margin:0}.page-sub{color:var(--muted);font-size:13px;margin-top:4px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:20px 0}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}.metric-label{font-size:12px;color:var(--muted)}.metric{font-size:25px;font-weight:800;margin-top:7px}.metric.green{color:var(--green)}.metric.red{color:var(--red)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.section-head h3{margin:0;font-size:16px}
.list{display:grid;gap:8px}.row{display:flex;justify-content:space-between;align-items:center;padding:13px;border:1px solid var(--line);border-radius:13px;background:#fff}.row-left{min-width:0}.row-title{font-weight:650}.small{font-size:12px;color:var(--muted);margin-top:3px}.amount{font-weight:750}.income{color:var(--green)}.expense{color:var(--red)}
.pill{font-size:11px;padding:5px 8px;border-radius:999px;background:#eee7df;color:var(--muted)}.pill.ok{background:#e4eee4;color:#617861}.pill.warn{background:#f5ead8;color:#8d6b37}.pill.bad{background:#f4e1df;color:#985d57}
.progress{height:8px;background:#eee7df;border-radius:999px;overflow:hidden;margin-top:10px}.progress>div{height:100%;background:var(--accent);border-radius:999px}
.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line);white-space:nowrap}.table th{color:var(--muted);font-weight:600}
.actions{display:flex;gap:8px;flex-wrap:wrap}.modal{position:fixed;inset:0;background:#3f393455;display:grid;place-items:center;padding:18px;z-index:20}.modal-card{width:min(620px,100%);max-height:90vh;overflow:auto;background:var(--card);border-radius:22px;padding:22px}.modal-head{display:flex;justify-content:space-between;align-items:center}.modal-head h3{margin:0}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.fab{position:fixed;right:18px;bottom:82px;width:56px;height:56px;border-radius:50%;background:var(--accent);color:white;font-size:25px;box-shadow:0 10px 25px #0002;z-index:12}.mobile-nav{display:none}.more-sheet{position:fixed;inset:0;background:#3f393455;z-index:30;display:flex;align-items:flex-end}.more-panel{width:100%;background:var(--card);border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px #0002}.more-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.more-item{background:#f4eee8;color:var(--text);border-radius:14px;padding:13px;text-align:left}.more-close{width:100%;margin-top:12px;background:#eee7df;color:var(--text);padding:12px;border-radius:13px}
@media(max-width:850px){.layout{display:block}.sidebar{display:none}main{padding:18px 14px 96px}.cards{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.mobile-nav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;background:#fffdf9ef;backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:11;padding:6px 3px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 18px #00000008}.mobile-nav button{background:transparent;color:var(--muted);font-size:11px;line-height:1.25;padding:5px 2px;min-width:0}.mobile-nav button.active{color:var(--text);font-weight:700}.topbar{padding:12px 14px}.user{display:none}}
@media(max-width:520px){.metric{font-size:20px}.form-grid{grid-template-columns:1fr}.fab{right:16px;bottom:78px}}
</style>
</head>
<body>

<div id="authView" class="auth">
<div class="auth-card">
<div class="brand">🐻‘s Money</div>

  <div class="more-panel">
    <div class="section-head">
      <div><h3 style="margin:0">更多功能</h3><div class="small">其他功能都放在這裡，手機畫面更清爽。</div></div>
      <button class="ghost" onclick="closeMoreSheet()">關閉</button>
    </div>
    <div class="more-grid">
      <button class="more-item" onclick="moreGo('preorders')">🛍️ 預購／待付款</button>
      <button class="more-item" onclick="moreGo('installments')">💳 分期管理</button>
      <button class="more-item" onclick="moreGo('bills')">🧾 固定繳費</button>
      <button class="more-item" onclick="moreGo('goals')">🎯 儲蓄目標</button>
      <button class="more-item" onclick="moreGo('common')">👥 共同費用</button>
      <button class="more-item" onclick="moreGo('store')">🛍️ 賣場／預收款</button>
      <button class="more-item" onclick="moreGo('borrowed')">💸 借入款</button>
      <button class="more-item" onclick="moreGo('search')">🔎 查詢</button>
      <button class="more-item" onclick="moreGo('categories')">🏷️ 分類管理</button>

<div id="modal" class="modal hidden" onclick="if(event.target.id==='modal')closeModal()"><div class="modal-card" id="modalCard"></div></div>

<script>
/* =========================
   SUPABASE
   ========================= */
const SUPABASE_URL = "https://eisatrwempqrprfimmby.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_h5X9H2Ewx1bkahQ4ss4OkA_TKMck2Fo";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* =========================
   STATE / HELPERS
   ========================= */
let currentUser=null,currentPage='dashboard';
let currentMonth=new Date().toISOString().slice(0,7);
let accounts=[],transactions=[],preorders=[],installments=[],installmentPayments=[],bills=[],goals=[],transfers=[],receivables=[],receivablePayments=[];
let commonExpenses=[],commonExpenseMembers=[],commonExpensePayments=[],commonExpenseCharges=[];
let storePrepayments=[],storePrepaymentUsages=[],storePrepaymentRefunds=[];
let borrowedFunds=[],borrowedRepayments=[],categories=[],budgets=[];

const money=n=>new Intl.NumberFormat('zh-TW',{style:'currency',currency:'TWD',maximumFractionDigits:0}).format(Number(n)||0);
const dateText=d=>d?new Date(d+'T00:00:00').toLocaleDateString('zh-TW',{year:'numeric',month:'2-digit',day:'2-digit'}):'-';
const today=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const pct=(a,b)=>b?Math.min(100,Math.max(0,(a/b)*100)):0;

/* =========================
   AUTH
   ========================= */
async function init(){
  const {data,error}=await db.auth.getSession();
  if(error){
    console.error(error);
    showAuth();
  }else if(data?.session?.user){
    await showApp(data.session.user);
  }else{
    showAuth();
  }

  db.auth.onAuthStateChange(async(_event,session)=>{
    if(session?.user && (!currentUser || currentUser.id!==session.user.id)){
      await showApp(session.user);
    }
  });
}

function showAuth(){
  document.getElementById('authView').classList.remove('hidden');
  document.getElementById('appView').classList.add('hidden');
}

async function showApp(user){
  currentUser=user;
  document.getElementById('authView').classList.add('hidden');
  document.getElementById('appView').classList.remove('hidden');
  document.getElementById('userEmail').textContent=user.email||'';
  await loadAll();
  render();
}

function switchAuth(mode){
  document.getElementById('loginTab').classList.toggle('active',mode==='login');
  document.getElementById('signupTab').classList.toggle('active',mode==='signup');
  document.getElementById('nameWrap').classList.toggle('hidden',mode!=='signup');
  document.getElementById('authBtn').textContent=mode==='signup'?'註冊':'登入';
  document.getElementById('authForm').dataset.mode=mode;
  document.getElementById('authMsg').textContent='';
}

document.getElementById('authForm').addEventListener('submit',async e=>{
  e.preventDefault();

  const mode=e.currentTarget.dataset.mode||'login';
  const email=document.getElementById('authEmail').value.trim();
  const password=document.getElementById('authPassword').value;
  const name=document.getElementById('authName').value.trim();
  const msg=document.getElementById('authMsg');
  const btn=document.getElementById('authBtn');

  msg.textContent='處理中…';
  btn.disabled=true;

  try{
    if(mode==='signup'){
      const {data,error}=await db.auth.signUp({
        email,
        password,
        options:{data:{name}}
      });

      if(error){
        msg.textContent=error.message;
        return;
      }

      if(data?.session && data?.user){
        await showApp(data.user);
      }else{
        msg.textContent='註冊成功！請到信箱點擊驗證連結，再回來登入。';
        switchAuth('login');
      }
    }else{
      const {data,error}=await db.auth.signInWithPassword({email,password});

      if(error){
        msg.textContent=error.message;
        return;
      }

      if(data?.session && data?.user){
        await showApp(data.user);
      }else{
        msg.textContent='登入失敗，請稍後再試。';
      }
    }
  }catch(err){
    console.error(err);
    msg.textContent='發生錯誤，請重新嘗試。';
  }finally{
    btn.disabled=false;
  }
});

async function logout(){
  await db.auth.signOut();
  currentUser=null;
  showAuth();
}

/* =========================
   DATA
   ========================= */
async function loadAll(){
  const tables=[['accounts','accounts'],['transactions','transactions'],['preorders','preorders'],['installments','installments'],['installment_payments','installmentPayments'],['transfers','transfers'],['receivables','receivables'],['receivable_payments','receivablePayments'],['bills','bills'],['goals','goals'],['common_expenses','commonExpenses'],['common_expense_members','commonExpenseMembers'],['common_expense_payments','commonExpensePayments'],['common_expense_charges','commonExpenseCharges'],['store_prepayments','storePrepayments'],['store_prepayment_usages','storePrepaymentUsages'],['store_prepayment_refunds','storePrepaymentRefunds'],['borrowed_funds','borrowedFunds'],['borrowed_repayments','borrowedRepayments'],['categories','categories'],['budgets','budgets']];
  for(const [table,key] of tables){
    const {data,error}=await db.from(table).select('*').order('created_at',{ascending:false});
    if(error){
      console.error(table,error);
      window[key]=[];
    }else{
      window[key]=data||[];
    }
  }
  accounts=window.accounts||[];
  transactions=window.transactions||[];
  preorders=window.preorders||[];
  installments=window.installments||[];
  installmentPayments=window.installmentPayments||[];
  transfers=window.transfers||[];
  receivables=window.receivables||[];
  receivablePayments=window.receivablePayments||[];
  bills=window.bills||[];
  goals=window.goals||[];
  commonExpenses=window.commonExpenses||[];
  commonExpenseMembers=window.commonExpenseMembers||[];
  commonExpensePayments=window.commonExpensePayments||[];
  commonExpenseCharges=window.commonExpenseCharges||[];
  storePrepayments=window.storePrepayments||[];
  storePrepaymentUsages=window.storePrepaymentUsages||[];
  storePrepaymentRefunds=window.storePrepaymentRefunds||[];
  borrowedFunds=window.borrowedFunds||[];
  borrowedRepayments=window.borrowedRepayments||[];
  categories=window.categories||[];
  budgets=window.budgets||[];
}

/* =========================
   NAV
   ========================= */
function setPage(p){
  currentPage=p;
  document.querySelectorAll('.navbtn,.mobile-nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));
  render();
}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));

/* =========================
   DASHBOARD
   ========================= */
function render(){
  const m=document.getElementById('main');
  ({dashboard:renderDashboard,transactions:renderTransactions,accounts:renderAccounts,search:renderSearch,common:renderCommonExpenses,store:renderStore,borrowed:renderBorrowed,budget:renderBudget,categories:renderCategories,preorders:renderPreorders,installments:renderInstallments,bills:renderBills,goals:renderGoals}[currentPage]||renderDashboard)();
}

function monthLabel(key){
  const [y,m]=key.split('-').map(Number);
  return `${y} 年 ${m} 月`;
}
function shiftMonth(key,delta){
  const [y,m]=key.split('-').map(Number);
  const d=new Date(y,m-1+delta,1);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}
function monthRange(key=currentMonth){
  const [y,m]=key.split('-').map(Number);
  return {start:`${y}-${String(m).padStart(2,'0')}-01`,end:new Date(y,m,0).toISOString().slice(0,10)};
}
function monthStats(key=currentMonth){
  const {start,end}=monthRange(key);
  const t=transactions.filter(x=>x.date>=start&&x.date<=end);
  let income=0,expense=0;
  for(const x of t){if(x.type==='income')income+=Number(x.amount);if(x.type==='expense')expense+=Number(x.amount);}
  return {income,expense,balance:income-expense,t};
}
function changeMonth(delta){currentMonth=shiftMonth(currentMonth,delta);render();}
function setMonth(key){if(/^\d{4}-\d{2}$/.test(key))currentMonth=key;render();}
function monthPicker(){return `<div class="actions" style="align-items:center;margin:14px 0"><button class="ghost" onclick="changeMonth(-1)">‹</button><input class="input" style="width:auto;min-width:150px" type="month" value="${currentMonth}" onchange="setMonth(this.value)"><button class="ghost" onclick="changeMonth(1)">›</button><button class="ghost" onclick="setMonth(new Date().toISOString().slice(0,7))">回到本月</button></div>`;}

function accountBalance(a){
  const tx=transactions.filter(t=>t.account_id===a.id).reduce((sum,t)=>{
    if(t.type==='income')return sum+Number(t.amount);
    if(t.type==='expense')return sum-Number(t.amount);
    return sum;
  },0);
  const trOut=transfers.filter(t=>t.from_account_id===a.id).reduce((s,t)=>s-Number(t.amount||0)-Number(t.fee||0),0);
  const trIn=transfers.filter(t=>t.to_account_id===a.id).reduce((s,t)=>s+Number(t.amount||0),0);
  const recOut=receivables.filter(r=>r.account_id===a.id).reduce((s,r)=>s-Number(r.amount||0),0);
  const recIn=receivablePayments.filter(p=>p.account_id===a.id).reduce((s,p)=>s+Number(p.amount||0),0);
  const commonIn=commonExpensePayments.filter(p=>p.account_id===a.id).reduce((s,p)=>s+Number(p.amount||0),0);
  const storeIn=storePrepayments.filter(p=>p.account_id===a.id).reduce((s,p)=>s+Number(p.amount||0),0);
  const storeRefund=storePrepaymentRefunds.filter(p=>p.account_id===a.id).reduce((s,p)=>s-Number(p.amount||0),0);
  const borrowedIn=borrowedFunds.filter(p=>p.account_id===a.id).reduce((s,p)=>s+Number(p.amount||0),0);
  const borrowedOut=borrowedRepayments.filter(p=>p.account_id===a.id).reduce((s,p)=>s-Number(p.amount||0),0);
  return Number(a.opening_balance||0)+tx+trOut+trIn+recOut+recIn+commonIn+storeIn+storeRefund+borrowedIn+borrowedOut;
}

function borrowedRemaining(x){
  return Math.max(0,Number(x.amount||0)-borrowedRepayments.filter(r=>r.borrowed_fund_id===x.id).reduce((s,r)=>s+Number(r.amount||0),0));
}
function includedAssets(){
  const base=accounts.filter(a=>a.include_in_total!==false).reduce((s,a)=>s+accountBalance(a),0);
  return base-borrowedFunds.filter(x=>x.include_in_assets===false).reduce((s,x)=>s+borrowedRemaining(x),0);
}
function borrowedTotalOutstanding(){return borrowedFunds.reduce((s,x)=>s+borrowedRemaining(x),0);}


function excludedAssets(){
  return accounts.filter(a=>a.include_in_total===false).reduce((s,a)=>s+accountBalance(a),0);
}

function receivableStats(){
  let advance=0,loan=0;
  for(const r of receivables){
    const remaining=Math.max(0,Number(r.amount||0)-Number(r.returned_amount||0));
    if(r.kind==='loan')loan+=remaining; else advance+=remaining;
  }
  return {advance,loan,total:advance+loan};
}

function committed(){
  const po=preorders.filter(x=>!['paid','cancelled'].includes(x.status)).reduce((s,x)=>s+Math.max(0,Number(x.total_amount)-Number(x.paid_amount||0)),0);
  const ins=installments.filter(x=>x.status==='active').reduce((s,x)=>s+Number(x.remaining_amount||0),0);
  const bi=bills.filter(x=>x.status!=='paid').reduce((s,x)=>s+Number(x.amount),0);
  return {po,ins,bi,total:po+ins+bi};
}

function renderDashboard(){
  const s=monthStats(),totalAssets=includedAssets(),allAssets=accounts.reduce((a,x)=>a+accountBalance(x),0),excluded=excludedAssets(),c=committed(),r=receivableStats();
  document.getElementById('main').innerHTML=`
  <div class="page-title">🐻‘s Money</div>
  <div class="page-sub">你的私人財務中控台 · ${monthLabel(currentMonth)}</div>

function storeUsageTotal(id){
  return storePrepaymentUsages.filter(x=>x.prepayment_id===id).reduce((s,x)=>s+Number(x.amount||0),0);
}
function storeRefundTotal(id){
  return storePrepaymentRefunds.filter(x=>x.prepayment_id===id).reduce((s,x)=>s+Number(x.amount||0),0);
}
function storeRemaining(x){
  return Math.max(0,Number(x.amount||0)-storeUsageTotal(x.id)-storeRefundTotal(x.id));
}
function storeStatus(x){
  const remain=storeRemaining(x);
  if(remain<=0)return 'completed';
  if(storeUsageTotal(x.id)>0||storeRefundTotal(x.id)>0)return 'partial';
  return 'open';
}
function storeStatusText(x){
  return {open:'尚未使用',partial:'部分使用',completed:'已結清'}[storeStatus(x)]||'尚未使用';
}
function storeStatusClass(x){
  return storeStatus(x)==='completed'?'ok':storeStatus(x)==='partial'?'warn':'bad';
}

async function saveStorePrepayment(e,id){
  e.preventDefault();
  const amount=Number(document.getElementById('spAmount').value);
  const used=id?storeUsageTotal(id):0,refunded=id?storeRefundTotal(id):0;
  if(amount<used+refunded)return alert(`收款金額不能低於已使用／退款合計 ${money(used+refunded)}。`);
  const payload={
    user_id:currentUser.id,
    customer_name:document.getElementById('spCustomer').value.trim(),
    amount,
    account_id:document.getElementById('spAccount').value,
    received_date:document.getElementById('spDate').value,
    order_ref:document.getElementById('spOrder').value.trim(),
    note:document.getElementById('spNote').value.trim()
  };
  const q=id?db.from('store_prepayments').update(payload).eq('id',id):db.from('store_prepayments').insert(payload);
  const {error}=await q;
  if(error)return alert(error.message);
  closeModal();await loadAll();render();
}

function coveredMonths(start,count){const [y,m]=start.split('-').map(Number);const end=new Date(y,m-1+count-1,1);return `${end.getFullYear()}-${String(end.getMonth()+1).padStart(2,'0')}`;}
function memberPayments(memberId){return commonExpensePayments.filter(p=>p.common_expense_member_id===memberId);}
function memberCovered(memberId,month){return memberPayments(memberId).some(p=>p.coverage_start.slice(0,7)<=month&&p.coverage_end.slice(0,7)>=month);}
function memberPaidThrough(memberId){const ps=memberPayments(memberId).slice().sort((a,b)=>a.coverage_end.localeCompare(b.coverage_end));return ps.length?ps[ps.length-1].coverage_end.slice(0,7):null;}
function commonExpenseMonthlyMembers(id){return commonExpenseMembers.filter(m=>m.common_expense_id===id);}
function commonExpenseChargeFor(id,month){return commonExpenseCharges.find(c=>c.common_expense_id===id&&c.charge_month.slice(0,7)===month);}

function renderCommonExpenses(){
  document.getElementById('main').innerHTML=`<div class="section-head"><div><div class="page-title">👥 共同費用</div><div class="page-sub">管理 Spotify、家庭會員等「我先付款、大家分攤」的費用</div></div><button class="primary" style="width:auto;margin:0" onclick="openCommonExpenseModal()">＋ 新增共同費用</button></div>${monthPicker()}<div class="list">${commonExpenses.map(x=>{const ms=commonExpenseMonthlyMembers(x.id),charge=commonExpenseChargeFor(x.id,currentMonth),others=ms.reduce((s,m)=>s+Number(m.monthly_share||0),0),self=Number(x.self_share||0);return `<div class="card"><div class="section-head"><div><h3>${esc(x.name)}</h3><div class="small">每月實際扣款 ${money(x.monthly_amount)} · ${monthLabel(currentMonth)}</div></div><span class="pill ${charge?'ok':'warn'}">${charge?'已記錄本月扣款':'尚未記錄本月扣款'}</span></div><div class="cards" style="margin:12px 0"><div class="card"><div class="metric-label">自己分攤</div><div class="metric">${money(self)}</div></div><div class="card"><div class="metric-label">其他人本月應分攤</div><div class="metric">${money(others)}</div></div><div class="card"><div class="metric-label">本月自己實際負擔</div><div class="metric">${money(Number(x.monthly_amount)-others)}</div></div></div><div class="actions"><button class="primary" style="width:auto;margin:0" onclick="openCommonChargeModal('${x.id}')">${charge?'查看本月扣款':'💳 記錄本月扣款'}</button><button class="ghost" onclick="openCommonExpenseDetail('${x.id}')">👥 成員／預付款</button><button class="ghost" onclick="openCommonExpenseModal('${x.id}')">✏️ 編輯</button><button class="danger" onclick="deleteCommonExpense('${x.id}')">🗑️ 刪除</button></div></div>`}).join('')||'<div class="card small">還沒有共同費用，例如可以先建立 Spotify。</div>'}</div>`;
}

function openCommonExpenseModal(id){
  const x=commonExpenses.find(a=>a.id===id)||{};
  const editing=!!id;
  const start=(x.start_month||currentMonth+'-01').slice(0,7);
  openModal(`<div class="modal-head"><h3>👥 ${editing?'編輯':'新增'}共同費用</h3><button class="ghost" onclick="closeModal()">關閉</button></div><form onsubmit="saveCommonExpense(event,'${id||''}')"><label>名稱</label><input id="ceName" class="input" required placeholder="例如 Spotify" value="${esc(x.name||'')}"><div class="form-grid"><div><label>每月實際扣款</label><input id="ceAmount" class="input" type="number" min="0" step="0.01" required placeholder="例如 298" value="${x.monthly_amount??''}"></div><div><label>自己每月分攤</label><input id="ceSelf" class="input" type="number" min="0" step="0.01" value="${x.self_share??50}" required></div><div><label>開始月份</label><input id="ceStart" class="input" type="month" value="${start}" required></div></div><div class="small" style="margin-top:10px">例如 Spotify：實際每月 $298、你自己 $50；其他成員各自設定每月分攤。有人一次付半年／一年時，付款會標記覆蓋月份，不會被算成一般收入。</div><button class="primary">${editing?'儲存修改':'建立'}</button></form>`);
}

async function saveCommonExpense(e,id){
  e.preventDefault();
  const payload={user_id:currentUser.id,name:document.getElementById('ceName').value.trim(),monthly_amount:Number(document.getElementById('ceAmount').value),self_share:Number(document.getElementById('ceSelf').value),start_month:document.getElementById('ceStart').value+'-01'};
  const q=id?db.from('common_expenses').update(payload).eq('id',id):db.from('common_expenses').insert(payload);
  const {error}=await q;
  if(error)return alert(error.message);
  closeModal();await loadAll();render();
}

async function deleteCommonExpense(id){
  const x=commonExpenses.find(a=>a.id===id);if(!x)return;
  if(!confirm(`確定刪除「${x.name}」？\n這會一併刪除成員、預付款與每月扣款紀錄。`))return;
  const charges=commonExpenseCharges.filter(c=>c.common_expense_id===id);
  for(const c of charges){
    if(c.transaction_id)await db.from('transactions').delete().eq('id',c.transaction_id);
  }
  const {error}=await db.from('common_expenses').delete().eq('id',id);
  if(error)return alert(error.message);
  closeModal();await loadAll();render();
}

  const x=commonExpenses.find(a=>a.id===id);if(!x)return;

}

async function saveCommonMember(e,expenseId,memberId){

function openCommonPaymentModal(memberId,paymentId){
  const m=commonExpenseMembers.find(x=>x.id===memberId);if(!m)return;
  const p=commonExpensePayments.find(x=>x.id===paymentId)||{};
  const editing=!!paymentId;
  const start=(p.coverage_start||currentMonth+'-01').slice(0,7);
  const months=Number(p.months_covered||1);
  openModal(`<div class="modal-head"><h3>💰 ${editing?'編輯':'收到'} ${esc(m.name)} 的分攤款</h3><button class="ghost" onclick="closeModal()">關閉</button></div><form onsubmit="saveCommonPayment(event,'${memberId}','${paymentId||''}')"><div class="form-grid"><div><label>付款金額</label><input id="cpAmount" class="input" type="number" min="0.01" step="0.01" value="${Number(p.amount??m.monthly_share)||0}" required></div><div><label>預付幾個月</label><select id="cpMonths" class="select"><option value="1">1 個月</option><option value="3">3 個月</option><option value="6">半年（6 個月）</option><option value="12">一年（12 個月）</option></select></div><div><label>覆蓋開始月份</label><input id="cpStart" class="input" type="month" value="${start}" required></div><div><label>收到日期</label><input id="cpDate" class="input" type="date" value="${p.payment_date||today()}" required></div><div><label>收到哪個帳戶</label><select id="cpAccount" class="select" required>${selectAccounts()}</select></div></div><div class="small" style="margin-top:10px">這筆錢會增加指定帳戶餘額，但不會算進收入統計。付款涵蓋月份會從開始月份往後計算。</div><label>備註</label><input id="cpNote" class="input" placeholder="例如 Spotify 半年費" value="${esc(p.note||'')}"><div class="actions" style="margin-top:14px">${editing?`<button type="button" class="danger" onclick="deleteCommonPayment('${paymentId}')">🗑️ 刪除這筆付款</button>`:''}<button class="primary">${editing?'儲存修改':'儲存分攤款'}</button></div></form>`);

async function saveCommonPayment(e,memberId,paymentId){
  e.preventDefault();
  const m=commonExpenseMembers.find(x=>x.id===memberId);if(!m)return;
  const months=Number(document.getElementById('cpMonths').value),start=document.getElementById('cpStart').value,amount=Number(document.getElementById('cpAmount').value),end=coveredMonths(start,months);
  const payload={user_id:currentUser.id,common_expense_id:m.common_expense_id,common_expense_member_id:memberId,amount,months_covered:months,coverage_start:start+'-01',coverage_end:end+'-01',payment_date:document.getElementById('cpDate').value,account_id:document.getElementById('cpAccount').value,note:document.getElementById('cpNote').value.trim()};
  const q=paymentId?db.from('common_expense_payments').update(payload).eq('id',paymentId):db.from('common_expense_payments').insert(payload);
  const {error}=await q;
  if(error)return alert(error.message);
  closeModal();await loadAll();openCommonExpenseDetail(m.common_expense_id);
}

  if(!confirm('確定刪除這筆分攤／預付款？\n刪除後這筆收到的金額也會從帳戶餘額中扣回。'))return;

function openCommonChargeModal(id){
  const x=commonExpenses.find(a=>a.id===id),existing=commonExpenseChargeFor(id,currentMonth);
  if(existing){
    openModal(`<div class="modal-head"><h3>💳 ${esc(x.name)}｜${monthLabel(currentMonth)}</h3><button class="ghost" onclick="closeModal()">關閉</button></div><div class="card"><div class="small">實際扣款</div><div class="metric">${money(existing.amount)}</div><div class="small">付款日期 ${dateText(existing.payment_date)} · 帳戶 ${esc(accounts.find(a=>a.id===existing.account_id)?.name||'-')}</div></div><div class="actions" style="margin-top:14px"><button class="primary" style="width:auto;margin:0" onclick="openCommonChargeModalEdit('${id}','${existing.id}')">✏️ 編輯扣款</button><button class="danger" onclick="deleteCommonCharge('${existing.id}')">🗑️ 刪除本月扣款</button></div>`);

function openCommonChargeModalEdit(id,chargeId){
  const x=commonExpenses.find(a=>a.id===id),existing=commonExpenseCharges.find(c=>c.id===chargeId)||{};
  if(!accounts.length){alert('請先建立付款帳戶。');setPage('accounts');return;}
  openModal(`<div class="modal-head"><h3>💳 ${esc(x.name)}｜${existing.id?'編輯':'記錄'} ${monthLabel(currentMonth)}扣款</h3><button class="ghost" onclick="closeModal()">關閉</button></div><form onsubmit="saveCommonCharge(event,'${id}','${chargeId||''}')"><div class="form-grid"><div><label>實際扣款金額</label><input id="ccAmount" class="input" type="number" min="0" step="0.01" value="${existing.amount??x.monthly_amount}" required></div><div><label>付款日期</label><input id="ccDate" class="input" type="date" value="${existing.payment_date||today()}" required></div><div><label>扣款帳戶</label><select id="ccAccount" class="select" required>${selectAccounts()}</select></div></div><div class="small">儲存後會建立／更新一筆真正的支出交易；其他人的分攤款不會變成收入，而是直接反映在帳戶餘額。</div><button class="primary">${existing.id?'儲存扣款修改':'✓ 記錄扣款'}</button></form>`);
  if(existing.account_id&&document.getElementById('ccAccount'))document.getElementById('ccAccount').value=existing.account_id;
}

async function saveCommonCharge(e,id,chargeId){
  e.preventDefault();
  const x=commonExpenses.find(a=>a.id===id),amount=Number(document.getElementById('ccAmount').value),date=document.getElementById('ccDate').value,accountId=document.getElementById('ccAccount').value;
  const note=`${x.name}｜${monthLabel(currentMonth)}`;
  if(chargeId){
    const c=commonExpenseCharges.find(v=>v.id===chargeId);if(!c)return;
    if(c.transaction_id){
      const {error:txError}=await db.from('transactions').update({amount,date,account_id:accountId,category:'共同費用',note}).eq('id',c.transaction_id);
      if(txError)return alert(txError.message);
    }else{
      const tx=await db.from('transactions').insert({user_id:currentUser.id,type:'expense',amount,date,account_id:accountId,category:'共同費用',note}).select('id').single();
      if(tx.error)return alert(tx.error.message);
      c.transaction_id=tx.data.id;
    }
    const {error}=await db.from('common_expense_charges').update({amount,payment_date:date,account_id:accountId,transaction_id:c.transaction_id,note}).eq('id',chargeId);
    if(error)return alert(error.message);
    closeModal();await loadAll();render();return;
  }
  const tx=await db.from('transactions').insert({user_id:currentUser.id,type:'expense',amount,date,account_id:accountId,category:'共同費用',note}).select('id').single();
  if(tx.error)return alert(tx.error.message);
  const {error}=await db.from('common_expense_charges').insert({user_id:currentUser.id,common_expense_id:id,charge_month:currentMonth+'-01',amount,payment_date:date,account_id:accountId,transaction_id:tx.data.id,note});
  if(error){await db.from('transactions').delete().eq('id',tx.data.id);return alert(error.message);}
  closeModal();await loadAll();render();
}

async function deleteCommonCharge(id){
  if(!confirm('刪除本月扣款紀錄？這也會刪除對應的共同費用支出。'))return;
  const c=commonExpenseCharges.find(x=>x.id===id);
  if(c?.transaction_id){const {error:txError}=await db.from('transactions').delete().eq('id',c.transaction_id);if(txError)return alert(txError.message);}
  const {error}=await db.from('common_expense_charges').delete().eq('id',id);
  if(error)return alert(error.message);
  closeModal();await loadAll();render();
}

async function deleteCommonMember(id){
  if(!confirm('刪除這位成員及其預付款紀錄？'))return;
  const m=commonExpenseMembers.find(a=>a.id===id);if(!m)return;

function renderTransactions(){
  const {start,end}=monthRange();
  const rows=[
    ...transactions.filter(t=>t.date>=start&&t.date<=end).map(t=>({kind:'tx',date:t.date,created_at:t.created_at,data:t})),
    ...transfers.filter(t=>t.date>=start&&t.date<=end).map(t=>({kind:'transfer',date:t.date,created_at:t.created_at,data:t}))
  ].sort((a,b)=>new Date((b.date||'')+'T00:00:00')-new Date((a.date||'')+'T00:00:00'));
  document.getElementById('main').innerHTML=`<div class="section-head"><div><div class="page-title">🧾 記帳</div><div class="page-sub">查看指定月份的收入、支出與帳戶轉帳</div></div><button class="primary" style="width:auto;margin:0" onclick="openTransactionModal()">＋ 新增</button></div>${monthPicker()}<div class="actions" style="margin-bottom:14px"><button class="ghost" onclick="openTransferModal()">🔄 帳戶轉帳</button><button class="ghost" onclick="openReceivableModal('advance')">🧾 新增代墊</button><button class="ghost" onclick="openReceivableModal('loan')">💸 新增借款</button></div><div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>日期</th><th>類型</th><th>分類</th><th>帳戶</th><th>金額</th><th>備註</th><th></th></tr></thead><tbody>${rows.map(row=>row.kind==='transfer'?transferRow(row.data):`<tr><td>${dateText(row.data.date)}</td><td>${row.data.type==='income'?'收入':'支出'}</td><td>${esc(row.data.category||'-')}</td><td>${esc(accounts.find(a=>a.id===row.data.account_id)?.name||'-')}</td><td class="${row.data.type==='income'?'income':'expense'}">${row.data.type==='income'?'+':'-'}${money(row.data.amount)}</td><td>${esc(row.data.note||'')}</td><td><div class="actions"><button class="ghost" onclick="openTransactionModal('${row.data.id}')">編輯</button><button class="danger" onclick="deleteRecord('transactions','${row.data.id}')">刪除</button></div></td></tr>`).join('')||`<tr><td colspan="7">${monthLabel(currentMonth)}沒有紀錄</td></tr>`}</tbody></table></div></div>`;
}

function transferRow(t){
  const from=accounts.find(a=>a.id===t.from_account_id)?.name||'-',to=accounts.find(a=>a.id===t.to_account_id)?.name||'-';
  return `<tr><td>${dateText(t.date)}</td><td>🔄 轉帳</td><td>帳戶轉帳</td><td>${esc(from)} → ${esc(to)}</td><td>${money(t.amount)}</td><td>${esc(t.note||'')}${Number(t.fee||0)?` · 手續費 ${money(t.fee)}`:''}</td><td><button class="danger" onclick="deleteTransfer('${t.id}')">刪除</button></td></tr>`;
}

function renderPreorders(){
  document.getElementById('main').innerHTML=`
  <div class="section-head"><div><div class="page-title">🛍️ 預購／待付款</div><div class="page-sub">已經承諾要花，但還沒完全付清的錢</div></div><button class="primary" style="width:auto;margin:0" onclick="openPreorderModal()">＋ 新增預購</button></div>
  <div class="list">${preorders.map(x=>{
    const remain=Math.max(0,Number(x.total_amount)-Number(x.paid_amount||0));

function openModal(html){document.getElementById('modalCard').innerHTML=html;document.getElementById('modal').classList.remove('hidden')}
function closeModal(){document.getElementById('modal').classList.add('hidden')}
function selectAccounts(){return accounts.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}

function categoryOptions(selected=''){
  const list=(categories||[]).filter(x=>x.active!==false).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));
  return `<option value="">請選擇分類</option>${list.map(c=>`<option value="${esc(c.name)}" ${c.name===selected?'selected':''}>${esc(c.name)}</option>`).join('')}`;
}
function categorySpend(name,key=currentMonth){const {start,end}=monthRange(key);return transactions.filter(t=>t.type==='expense'&&t.date>=start&&t.date<=end&&t.category===name).reduce((s,t)=>s+Number(t.amount||0),0)}
function budgetAmount(categoryId,key=currentMonth){const x=budgets.find(b=>b.category_id===categoryId&&b.month===key);return Number(x?.amount||0)}
function renderCategories(){
 const list=[...(categories||[])].sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));
 document.getElementById('main').innerHTML=`<div class="section-head"><div><div class="page-title">🏷️ 分類管理</div><div class="page-sub">分類可新增、編輯、停用；停用不會影響歷史記帳。</div></div><button class="primary" style="width:auto;margin:0" onclick="openCategoryModal()">＋ 新增分類</button></div><div class="list">${list.map(c=>`<div class="row"><div><div class="row-title">${esc(c.icon||'🏷️')} ${esc(c.name)}</div><div class="small">${c.active===false?'已停用':'使用中'}</div></div><div class="actions"><button class="ghost" onclick="openCategoryModal('${c.id}')">編輯</button><button class="${c.active===false?'ghost':'danger'}" onclick="toggleCategory('${c.id}',${c.active===false})">${c.active===false?'啟用':'停用'}</button></div></div>`).join('')}</div>`;
}
function openCategoryModal(id=''){const x=categories.find(c=>c.id===id)||{};openModal(`<div class="modal-head"><h3>${id?'編輯':'新增'}分類</h3><button class="ghost" onclick="closeModal()">關閉</button></div><form onsubmit="saveCategory(event,'${id}')"><label>分類名稱</label><input id="cName" class="input" required value="${esc(x.name||'')}"><label>圖示</label><input id="cIcon" class="input" value="${esc(x.icon||'🏷️')}" maxlength="4"><button class="primary">儲存</button></form>`)}
async function saveCategory(e,id){e.preventDefault();const name=document.getElementById('cName').value.trim(),icon=document.getElementById('cIcon').value.trim()||'🏷️';if(categories.some(c=>c.name===name&&c.id!==id&&c.active!==false))return alert('已有相同分類名稱。');const payload={user_id:currentUser.id,name,icon,active:true};const q=id?db.from('categories').update(payload).eq('id',id):db.from('categories').insert(payload);const {error}=await q;if(error)return alert(error.message);closeModal();await loadAll();render()}
async function toggleCategory(id,active){const {error}=await db.from('categories').update({active}).eq('id',id);if(error)return alert(error.message);await loadAll();render()}
function renderBudget(){const list=(categories||[]).filter(c=>c.active!==false).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));const income=monthStats().income,totalBudget=list.reduce((s,c)=>s+budgetAmount(c.id),0),spent=list.reduce((s,c)=>s+categorySpend(c.name),0);document.getElementById('main').innerHTML=`<div class="page-title">💰 預算分配表</div><div class="page-sub">${monthLabel(currentMonth)}｜設定每個分類本月可以花多少。</div>${monthPicker()}<div class="cards"><div class="card"><div class="metric-label">本月收入</div><div class="metric green">${money(income)}</div></div><div class="card"><div class="metric-label">已分配預算</div><div class="metric">${money(totalBudget)}</div></div><div class="card"><div class="metric-label">尚未分配</div><div class="metric ${income-totalBudget<0?'red':''}">${money(income-totalBudget)}</div></div><div class="card"><div class="metric-label">已使用</div><div class="metric red">${money(spent)}</div></div></div><div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>分類</th><th>預算</th><th>已使用</th><th>剩餘</th><th>使用率</th><th></th></tr></thead><tbody>${list.map(c=>{const b=budgetAmount(c.id),u=categorySpend(c.name),r=b-u,p=b?Math.round(u/b*100):0;return `<tr><td>${esc(c.icon||'🏷️')} ${esc(c.name)}</td><td>${money(b)}</td><td>${money(u)}</td><td class="${r<0?'expense':''}">${r<0?'超支 ':''}${money(Math.abs(r))}</td><td>${b?Math.round(u/b*100)+'%':'—'}</td><td><button class="ghost" onclick="openBudgetModal('${c.id}')">設定</button></td></tr>`}).join('')}</tbody></table></div></div>`}
function openBudgetModal(categoryId){const c=categories.find(x=>x.id===categoryId);if(!c)return;const b=budgetAmount(categoryId);openModal(`<div class="modal-head"><h3>💰 ${esc(c.name)}｜${monthLabel(currentMonth)}</h3><button class="ghost" onclick="closeModal()">關閉</button></div><form onsubmit="saveBudget(event,'${categoryId}')"><label>本月預算</label><input id="bAmount" class="input" type="number" min="0" step="1" value="${b}"><button class="primary">儲存</button></form>`)}
async function saveBudget(e,categoryId){e.preventDefault();const amount=Number(document.getElementById('bAmount').value||0),x=budgets.find(b=>b.category_id===categoryId&&b.month===currentMonth);let q=x?(amount>0?db.from('budgets').update({amount}).eq('id',x.id):db.from('budgets').delete().eq('id',x.id)):(amount>0?db.from('budgets').insert({user_id:currentUser.id,category_id:categoryId,month:currentMonth,amount}):{error:null});if(q.error)return alert(q.error.message);const {error}=await q;if(error)return alert(error.message);closeModal();await loadAll();render()}

async function saveTransfer(e){
  e.preventDefault();
  const from=document.getElementById('trFrom').value,to=document.getElementById('trTo').value,amount=Number(document.getElementById('trAmount').value),fee=Number(document.getElementById('trFee').value||0),date=document.getElementById('trDate').value,note=document.getElementById('trNote').value.trim();
  if(from===to)return alert('轉出與轉入帳戶不能相同。');
  const tx=fee>0?await db.from('transactions').insert({user_id:currentUser.id,type:'expense',amount:fee,date,account_id:from,category:'銀行手續費',note:note?`帳戶轉帳｜${note}`:'帳戶轉帳手續費'}).select('id').single():{data:null,error:null};
  if(tx.error)return alert(tx.error.message);
  const {error}=await db.from('transfers').insert({user_id:currentUser.id,from_account_id:from,to_account_id:to,amount,fee,date,note,fee_transaction_id:tx.data?.id||null});
  if(error){if(tx.data?.id)await db.from('transactions').delete().eq('id',tx.data.id);return alert(error.message);}
  closeModal();await loadAll();render();
}
async function deleteTransfer(id){
  if(!confirm('確定刪除這筆轉帳嗎？'))return;
  const x=transfers.find(t=>t.id===id);if(!x)return;
  if(x.fee_transaction_id)await db.from('transactions').delete().eq('id',x.fee_transaction_id);
  const {error}=await db.from('transfers').delete().eq('id',id);if(error)return alert(error.message);
  await loadAll();render();
}

function getReceivableRemaining(x){return Math.max(0,Number(x.amount||0)-Number(x.returned_amount||0));}

async function saveReceivablePayment(e,id){
  e.preventDefault();

function addMonths(base,n,day){
  if(!base)return null;
  const d=new Date(base+'T00:00:00');
  d.setMonth(d.getMonth()+n);
  d.setDate(Math.min(day||d.getDate(),28));
  return d.toISOString().slice(0,10);
}

async function saveInstallmentPayment(e,id,periodNumber){
  e.preventDefault();
  const btn=document.getElementById('paySubmit');btn.disabled=true;btn.textContent='儲存中…';
  const x=installments.find(a=>a.id===id);if(!x)return;
  const amount=Number(document.getElementById('payAmount').value);
  const date=document.getElementById('payDate').value;
  const accountId=document.getElementById('payAccount').value;
  const note=document.getElementById('payNote').value.trim();
  const file=document.getElementById('payReceipt').files[0];
  let receiptPath=null;
  try{
    if(file){
      if(file.size>5*1024*1024)throw new Error('圖片超過 5 MB，請換一張較小的圖片。');
      if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw new Error('只允許 JPG、PNG、WebP 圖片。');
      const ext=file.type==='image/jpeg'?'jpg':file.type.split('/')[1];
      receiptPath=`${currentUser.id}/${id}/${periodNumber}-${Date.now()}.${ext}`;
      const up=await db.storage.from('payment-receipts').upload(receiptPath,file,{contentType:file.type,upsert:false});
      if(up.error)throw up.error;
    }

    const tx=await db.from('transactions').insert({
      user_id:currentUser.id,type:'expense',amount,date,account_id:accountId,
      category:'分期付款',note:note||`${x.name}｜第${periodNumber}期`
    }).select('id').single();
    if(tx.error)throw tx.error;

    let pay=await db.from('installment_payments').insert({
      user_id:currentUser.id,installment_id:id,period_number:periodNumber,
      payment_date:date,amount,account_id:accountId,note,receipt_path:receiptPath,
      transaction_id:tx.data.id
    });

    // 如果你目前尚未加入 transaction_id 欄位，先用不含該欄位的版本寫入，
    // 這樣付款功能仍可正常使用。之後再補欄位即可。
    if(pay.error && /transaction_id|column.*does not exist/i.test(pay.error.message||'')){
      pay=await db.from('installment_payments').insert({
        user_id:currentUser.id,installment_id:id,period_number:periodNumber,
        payment_date:date,amount,account_id:accountId,note,receipt_path:receiptPath
      });
    }

    if(pay.error){
      await db.from('transactions').delete().eq('id',tx.data.id);
      if(receiptPath)await db.storage.from('payment-receipts').remove([receiptPath]);
      throw pay.error;
    }

    const nextPaid=periodNumber;
    const upd=await db.from('installments').update({
      paid_periods:nextPaid,
      remaining_amount:Math.max(0,Number(x.total_amount)-nextPaid*Number(x.period_amount)),
      status:nextPaid>=Number(x.total_periods)?'completed':'active'
    }).eq('id',id);
    if(upd.error)throw upd.error;

    closeModal();await loadAll();render();
  }catch(err){
    console.error(err);alert(err.message||'付款紀錄儲存失敗，請再試一次。');
    btn.disabled=false;btn.textContent='✓ 儲存付款紀錄';
  }
}

async function undoInstallmentPaid(id){
  const x=installments.find(a=>a.id===id);if(!x)return;
  const paid=Number(x.paid_periods||0);if(paid<=0)return;
  const payment=getInstallmentPayments(id).find(p=>Number(p.period_number)===paid);
  if(!payment){alert('找不到這一期的付款紀錄，請不要直接撤銷，避免資料不同步。');return;}
  if(!confirm(`確定把第 ${paid} 期改回「待繳」嗎？\n這會同時刪除這一期的付款紀錄與記帳。`))return;
  const {error:delPay}=await db.from('installment_payments').delete().eq('id',payment.id);
  if(delPay)return alert(delPay.message);
  if(payment.transaction_id){
    const {error:delTx}=await db.from('transactions').delete().eq('id',payment.transaction_id);
    if(delTx)return alert(delTx.message);
  }else{
    // 尚未建立 transaction_id 欄位時，依付款紀錄找對應的分期支出。
    const txNote=payment.note||`${x.name}｜第${paid}期`;
    const {data:txRows}=await db.from('transactions').select('id,created_at').eq('user_id',currentUser.id).eq('type','expense').eq('amount',payment.amount).eq('date',payment.payment_date).eq('account_id',payment.account_id).eq('category','分期付款').eq('note',txNote).order('created_at',{ascending:false}).limit(1);
    if(txRows?.[0]){
      const {error:delTx}=await db.from('transactions').delete().eq('id',txRows[0].id);
      if(delTx)return alert(delTx.message);
    }
  }
  if(payment.receipt_path)await db.storage.from('payment-receipts').remove([payment.receipt_path]);
  const nextPaid=paid-1;
  const {error}=await db.from('installments').update({
    paid_periods:nextPaid,
    remaining_amount:Math.max(0,Number(x.total_amount)-nextPaid*Number(x.period_amount)),
    status:'active'
  }).eq('id',id);
  if(error)return alert(error.message);
  await loadAll();render();
}

function openInstallmentDetail(id){
  const x=installments.find(a=>a.id===id);if(!x)return;
  const paid=Number(x.paid_periods||0),payments=getInstallmentPayments(id);
  let rows='';
  for(let n=1;n<=x.total_periods;n++){
    const p=payments.find(v=>Number(v.period_number)===n);
    // 舊版分期只有 paid_periods，沒有逐期 payment record。
    // 因此 n <= paid 時仍要視為已繳，並標示為歷史補登。
    const isPaid=!!p || n<=paid;

    const receiptHtml=p?.receipt_path?`<button class="ghost" onclick="viewReceipt('${p.receipt_path}')">📸 查看</button>`:'-';
    rows+=`<tr><td>第 ${n} 期</td><td>${dateText(dueDate)}</td><td>${money(p?.amount??x.period_amount)}</td><td>${statusHtml}</td><td>${receiptHtml}</td></tr>`;

  openModal(`<div class="modal-head"><div><h3 style="margin:0">${esc(x.name)}</h3><div class="small">${paid}/${x.total_periods} 期 · 剩餘 ${money(x.remaining_amount)}</div></div><button class="ghost" onclick="closeModal()">關閉</button></div><div class="table-wrap" style="margin-top:14px"><table class="table"><thead><tr><th>期數</th><th>預定日</th><th>金額</th><th>狀態</th><th>明細</th></tr></thead><tbody>${rows}</tbody></table></div><div class="actions" style="margin-top:14px">${paid<x.total_periods?`<button class="primary" style="width:auto;margin:0" onclick="closeModal();openPaymentModal('${id}')">💰 紀錄下一期付款</button>`:''}${paid>0?`<button class="ghost" onclick="closeModal();undoInstallmentPaid('${id}')">↩ 撤銷最後一期</button>`:''}<button class="ghost" onclick="closeModal();openInstallmentModal('${id}')">修改分期</button></div>`);
}

  if(!editing&&borrowedRemaining(x)<=0)return alert('這筆借款已全部還清。');
  if(!accounts.length){alert('請先建立帳戶。');setPage('accounts');return;}
  openModal(`<div class="modal-head"><h3>💰 ${editing?'編輯':'記錄'}還款</h3><button class="ghost" onclick="closeModal()">關閉</button></div><form onsubmit="saveBorrowedRepayment(event,'${id}','${repaymentId}')"><div class="form-grid"><div><label>還款金額</label><input id="brAmount" class="input" type="number" min="0.01" max="${remain}" step="0.01" value="${r.amount??remain}" required></div><div><label>還款日期</label><input id="brDate" class="input" type="date" value="${r.repayment_date||today()}" required></div><div><label>還款帳戶</label><select id="brAccount" class="select" required>${selectAccounts()}</select></div></div><label>備註</label><input id="brNote" class="input" value="${esc(r.note||'')}">${editing?`<button type="button" class="danger" style="margin-top:12px" onclick="deleteBorrowedRepayment('${repaymentId}','${id}')">🗑️ 刪除</button>`:''}<button class="primary">${editing?'儲存修改':'確認還款'}</button></form>`);
  if(r.account_id)document.getElementById('brAccount').value=r.account_id;
}
async function saveBorrowedRepayment(e,id,repaymentId=''){
  e.preventDefault();const x=borrowedFunds.find(a=>a.id===id);if(!x)return;const amount=Number(document.getElementById('brAmount').value),current=repaymentId?Number(borrowedRepayments.find(r=>r.id===repaymentId)?.amount||0):0;
  if(amount<=0||amount>borrowedRemaining(x)+current)return alert('還款金額超過尚未償還金額。');
  const payload={user_id:currentUser.id,borrowed_fund_id:id,amount,repayment_date:document.getElementById('brDate').value,account_id:document.getElementById('brAccount').value,note:document.getElementById('brNote').value.trim()};
  const {error}=await (repaymentId?db.from('borrowed_repayments').update(payload).eq('id',repaymentId):db.from('borrowed_repayments').insert(payload));
  if(error)return alert(error.message);closeModal();await loadAll();openBorrowedDetail(id);
}
async function deleteBorrowedRepayment(rid,id){
  if(!confirm('確定刪除這筆還款？'))return;const {error}=await db.from('borrowed_repayments').delete().eq('id',rid);if(error)return alert(error.message);
  closeModal();await loadAll();openBorrowedDetail(id);
}
function openBorrowedDetail(id){
  const x=borrowedFunds.find(a=>a.id===id);if(!x)return;const rs=borrowedRepayments.filter(r=>r.borrowed_fund_id===id),remain=borrowedRemaining(x);
  openModal(`<div class="modal-head"><div><h3>📋 ${esc(x.person_name)}｜還款明細</h3><div class="small">原始 ${money(x.amount)} · 已還 ${money(Number(x.amount)-remain)} · 剩餘 ${money(remain)}</div></div><button class="ghost" onclick="closeModal()">關閉</button></div><div class="list" style="margin-top:14px">${rs.map(r=>`<div class="row"><div><b>${money(r.amount)}</b><div class="small">${dateText(r.repayment_date)}${r.note?' · '+esc(r.note):''}</div></div><div class="actions"><button class="ghost" onclick="openBorrowedRepaymentModal('${id}','${r.id}')">✏️</button><button class="danger" onclick="deleteBorrowedRepayment('${r.id}','${id}')">🗑️</button></div></div>`).join('')||'<div class="small">尚未還款。</div>'}</div><div class="actions" style="margin-top:14px">${remain>0?`<button class="primary" style="width:auto;margin:0" onclick="closeModal();openBorrowedRepaymentModal('${id}')">💰 記錄還款</button>`:''}<button class="ghost" onclick="closeModal();openBorrowedModal('${id}')">✏️ 修改借入款</button></div>`);
}
async function deleteBorrowed(id){
  const x=borrowedFunds.find(a=>a.id===id);if(!x)return;if(!confirm(`確定刪除「${x.person_name}」這筆借入款？還款明細也會刪除。`))return;
  const {error}=await db.from('borrowed_funds').delete().eq('id',id);if(error)return alert(error.message);closeModal();await loadAll();render();
}

function openMoreSheet(){
  document.getElementById('moreSheet').classList.remove('hidden');
}
function closeMoreSheet(){
  document.getElementById('moreSheet').classList.add('hidden');
}
function moreGo(page){
  closeMoreSheet();
  setPage(page);
}

function quickAdd(){
  if(window.matchMedia && window.matchMedia('(max-width:850px)').matches){
    openModal(`<div class="modal-head"><div><h3>＋ 新增</h3><div class="small">選擇你要新增的項目</div></div><button class="ghost" onclick="closeModal()">關閉</button></div>
      <div class="more-grid" style="margin-top:14px">
        <button class="more-item" onclick="closeModal();openTransactionModal()">🧾 記一筆收入／支出</button>
        <button class="more-item" onclick="closeModal();openTransferModal()">🔄 帳戶轉帳</button>
        <button class="more-item" onclick="closeModal();openPreorderModal()">🛍️ 新增預購</button>
        <button class="more-item" onclick="closeModal();openInstallmentModal()">💳 新增分期</button>
        <button class="more-item" onclick="closeModal();openBillModal()">🧾 新增帳單</button>
        <button class="more-item" onclick="closeModal();openGoalModal()">🎯 新增儲蓄目標</button>
        <button class="more-item" onclick="closeModal();openCommonExpenseModal()">👥 新增共同費用</button>
        <button class="more-item" onclick="closeModal();openStorePrepaymentModal()">🛍️ 新增賣場預收款</button>
        <button class="more-item" onclick="closeModal();openBorrowedModal()">💸 新增借入款</button>
      </div>`);
    return;
  }
  if(currentPage==='dashboard'||currentPage==='transactions')openTransactionModal();
  else if(currentPage==='preorders')openPreorderModal();
  else if(currentPage==='installments')openInstallmentModal();
  else if(currentPage==='bills')openBillModal();
  else if(currentPage==='goals')openGoalModal();
  else if(currentPage==='common')openCommonExpenseModal();
  else if(currentPage==='store')openStorePrepaymentModal();
  else if(currentPage==='borrowed')openBorrowedModal();
  else if(currentPage==='budget')openBudgetModal(categories[0]?.id||'');
  else openTransactionModal();
}

init();
</script>
</body>
</html>
