<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#f4eee7" />
<title>🐻‘s Money</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f7f3ee;--card:#fffdf9;--text:#3f3934;--muted:#8d837a;--line:#e8dfd6;--accent:#9b806b;--green:#738b73;--red:#b47770;--shadow:0 10px 30px rgba(91,70,52,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}
.auth{min-height:100vh;display:grid;place-items:center;padding:24px}.auth-card{width:min(430px,100%);background:var(--card);padding:32px;border-radius:28px;box-shadow:var(--shadow)}
.brand{text-align:center;font-size:28px;font-weight:800;margin-bottom:8px}.sub{text-align:center;color:var(--muted);font-size:14px;margin-bottom:28px}
.tabs{display:flex;background:#f0e9e2;padding:4px;border-radius:14px;margin-bottom:20px}.tabs button{flex:1;padding:10px;border-radius:10px;background:transparent;color:var(--muted)}.tabs button.active{background:white;color:var(--text);box-shadow:0 2px 8px #0000000b}
label{display:block;font-size:13px;color:var(--muted);margin:14px 0 7px}.input,.select,.textarea{width:100%;border:1px solid var(--line);background:white;border-radius:12px;padding:12px;color:var(--text);outline:none}
.primary{width:100%;background:var(--accent);color:white;padding:13px;border-radius:13px;font-weight:700;margin-top:18px}.primary:disabled{opacity:.6;cursor:not-allowed}
.ghost{background:#eee7df;color:var(--text);padding:10px 14px;border-radius:11px}.danger{background:#f5e2df;color:#9d5b55;padding:9px 12px;border-radius:10px}
.app{min-height:100vh}.topbar{position:sticky;top:0;z-index:5;background:#f7f3eedf;backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
.topbrand{font-weight:800;font-size:20px}.user{font-size:12px;color:var(--muted);margin-right:8px}.layout{display:grid;grid-template-columns:220px 1fr;max-width:1250px;margin:auto}
.sidebar{padding:22px 14px;border-right:1px solid var(--line);min-height:calc(100vh - 65px)}.navbtn{width:100%;text-align:left;background:transparent;color:var(--muted);padding:12px;border-radius:12px;margin:2px 0}.navbtn.active,.navbtn:hover{background:#eee7df;color:var(--text)}
main{padding:24px;min-width:0}.page-title{font-size:25px;font-weight:800;margin:0}.page-sub{color:var(--muted);font-size:13px;margin-top:4px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:20px 0}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}.metric-label{font-size:12px;color:var(--muted)}.metric{font-size:25px;font-weight:800;margin-top:7px}.metric.green{color:var(--green)}.metric.red{color:var(--red)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.section-head h3{margin:0;font-size:16px}
.list{display:grid;gap:8px}.row{display:flex;justify-content:space-between;align-items:center;padding:13px;border:1px solid var(--line);border-radius:13px;background:#fff}.row-left{min-width:0}.row-title{font-weight:650}.small{font-size:12px;color:var(--muted);margin-top:3px}.amount{font-weight:750}.income{color:var(--green)}.expense{color:var(--red)}
.pill{font-size:11px;padding:5px 8px;border-radius:999px;background:#eee7df;color:var(--muted)}.pill.ok{background:#e4eee4;color:#617861}.pill.warn{background:#f5ead8;color:#8d6b37}.pill.bad{background:#f4e1df;color:#985d57}
.progress{height:8px;background:#eee7df;border-radius:999px;overflow:hidden;margin-top:10px}.progress>div{height:100%;background:var(--accent);border-radius:999px}
.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line);white-space:nowrap}.table th{color:var(--muted);font-weight:600}
.actions{display:flex;gap:8px;flex-wrap:wrap}.modal{position:fixed;inset:0;background:#3f393455;display:grid;place-items:center;padding:18px;z-index:20}.modal-card{width:min(620px,100%);max-height:90vh;overflow:auto;background:var(--card);border-radius:22px;padding:22px}.modal-head{display:flex;justify-content:space-between;align-items:center}.modal-head h3{margin:0}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.fab{position:fixed;right:20px;bottom:20px;width:58px;height:58px;border-radius:50%;background:var(--accent);color:white;font-size:25px;box-shadow:0 10px 25px #0002;z-index:10}.mobile-nav{display:none}
@media(max-width:850px){.layout{display:block}.sidebar{display:none}main{padding:18px 14px 90px}.cards{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fffdf9ef;backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:9;justify-content:space-around;padding:8px 4px}.mobile-nav button{background:transparent;color:var(--muted);font-size:11px;padding:7px}.mobile-nav button.active{color:var(--text);font-weight:700}.topbar{padding:12px 14px}.user{display:none}}
@media(max-width:520px){.metric{font-size:20px}.form-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="authView" class="auth">
<div class="auth-card">
<div class="brand">🐻‘s Money</div>
<div class="sub">把錢放在心上，也把生活記下來。</div>
<div class="tabs">
<button id="loginTab" class="active" type="button" onclick="switchAuth('login')">登入</button>
<button id="signupTab" type="button" onclick="switchAuth('signup')">註冊</button>
</div>

<form id="authForm">
<label>Email</label>
<input id="authEmail" class="input" type="email" required placeholder="you@example.com">
<label>密碼</label>
<input id="authPassword" class="input" type="password" minlength="6" required placeholder="至少 6 碼">
<div id="nameWrap" class="hidden">
<label>暱稱</label>
<input id="authName" class="input" placeholder="例如 Luby">
</div>
<button type="submit" class="primary" id="authBtn">登入</button>
</form>
<div id="authMsg" class="small" style="text-align:center;margin-top:12px"></div>
</div>
</div>

<div id="appView" class="app hidden">
<div class="topbar">
<div class="topbrand">🐻‘s Money</div>
<div><span class="user" id="userEmail"></span><button class="ghost" onclick="logout()">登出</button></div>
</div>
<div class="layout">
<aside class="sidebar">
<button class="navbtn active" data-page="dashboard">🏠 總覽</button>
<button class="navbtn" data-page="transactions">🧾 記帳</button>
<button class="navbtn" data-page="accounts">🏦 帳戶</button>
<button class="navbtn" data-page="preorders">🛍️ 預購／待付款</button>
<button class="navbtn" data-page="installments">💳 分期管理</button>
<button class="navbtn" data-page="bills">🧾 固定繳費</button>
<button class="navbtn" data-page="goals">🎯 儲蓄目標</button>
</aside>
<main id="main"></main>
</div>
<div class="mobile-nav">
<button data-page="dashboard">🏠<br>總覽</button>
<button data-page="transactions">🧾<br>記帳</button>
<button data-page="preorders">🛍️<br>預購</button>
<button data-page="installments">💳<br>分期</button>
<button data-page="accounts">🏦<br>帳戶</button>
</div>
<button class="fab" onclick="quickAdd()">＋</button>
</div>

<div id="modal" class="modal hidden" onclick="if(event.target.id==='modal')closeModal()"><div class="modal-card" id="modalCard"></div></div>

<script>
/* =========================
   SUPABASE
   ========================= */
const SUPABASE_URL = "https://eisatrwempqrprfimmby.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_h5X9H2Ewx1bkahQ4ss4OkA_TKMck2Fo";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* =========================
   STATE / HELPERS
   ========================= */
let currentUser=null,currentPage='dashboard';
let accounts=[],transactions=[],preorders=[],installments=[],installmentPayments=[],bills=[],goals=[],transfers=[],receivables=[],receivablePayments=[];

const money=n=>new Intl.NumberFormat('zh-TW',{style:'currency',currency:'TWD',maximumFractionDigits:0}).format(Number(n)||0);
const dateText=d=>d?new Date(d+'T00:00:00').toLocaleDateString('zh-TW',{year:'numeric',month:'2-digit',day:'2-digit'}):'-';
const today=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const pct=(a,b)=>b?Math.min(100,Math.max(0,(a/b)*100)):0;

/* =========================
   AUTH
   ========================= */
async function init(){
  const {data,error}=await db.auth.getSession();
  if(error){
    console.error(error);
    showAuth();
  }else if(data?.session?.user){
    await showApp(data.session.user);
  }else{
    showAuth();
  }

  db.auth.onAuthStateChange(async(_event,session)=>{
    if(session?.user && (!currentUser || currentUser.id!==session.user.id)){
      await showApp(session.user);
    }
  });
}

function showAuth(){
  document.getElementById('authView').classList.remove('hidden');
  document.getElementById('appView').classList.add('hidden');
}

async function showApp(user){
  currentUser=user;
  document.getElementById('authView').classList.add('hidden');
  document.getElementById('appView').classList.remove('hidden');
  document.getElementById('userEmail').textContent=user.email||'';
  await loadAll();
  render();
}

function switchAuth(mode){
  document.getElementById('loginTab').classList.toggle('active',mode==='login');
  document.getElementById('signupTab').classList.toggle('active',mode==='signup');
  document.getElementById('nameWrap').classList.toggle('hidden',mode!=='signup');
  document.getElementById('authBtn').textContent=mode==='signup'?'註冊':'登入';
  document.getElementById('authForm').dataset.mode=mode;
  document.getElementById('authMsg').textContent='';
}

document.getElementById('authForm').addEventListener('submit',async e=>{
  e.preventDefault();

  const mode=e.currentTarget.dataset.mode||'login';
  const email=document.getElementById('authEmail').value.trim();
  const password=document.getElementById('authPassword').value;
  const name=document.getElementById('authName').value.trim();
  const msg=document.getElementById('authMsg');
  const btn=document.getElementById('authBtn');

  msg.textContent='處理中…';
  btn.disabled=true;

  try{
    if(mode==='signup'){
      const {data,error}=await db.auth.signUp({
        email,
        password,
        options:{data:{name}}
      });

      if(error){
        msg.textContent=error.message;
        return;
      }

      if(data?.session && data?.user){
        await showApp(data.user);
      }else{
        msg.textContent='註冊成功！請到信箱點擊驗證連結，再回來登入。';
        switchAuth('login');
      }
    }else{
      const {data,error}=await db.auth.signInWithPassword({email,password});

      if(error){
        msg.textContent=error.message;
        return;
      }

      if(data?.session && data?.user){
        await showApp(data.user);
      }else{
        msg.textContent='登入失敗，請稍後再試。';
      }
    }
  }catch(err){
    console.error(err);
    msg.textContent='發生錯誤，請重新嘗試。';
  }finally{
    btn.disabled=false;
  }
});

async function logout(){
  await db.auth.signOut();
  currentUser=null;
  showAuth();
}

/* =========================
   DATA
   ========================= */
async function loadAll(){
  const tables=[['accounts','accounts'],['transactions','transactions'],['preorders','preorders'],['installments','installments'],['installment_payments','installmentPayments'],['transfers','transfers'],['receivables','receivables'],['receivable_payments','receivablePayments'],['bills','bills'],['goals','goals']];
  for(const [table,key] of tables){
    const {data,error}=await db.from(table).select('*').order('created_at',{ascending:false});
    if(error){
      console.error(table,error);
      window[key]=[];
    }else{
      window[key]=data||[];
    }
  }
  accounts=window.accounts||[];
  transactions=window.transactions||[];
  preorders=window.preorders||[];
  installments=window.installments||[];
  installmentPayments=window.installmentPayments||[];
  transfers=window.transfers||[];
  receivables=window.receivables||[];
  receivablePayments=window.receivablePayments||[];
  bills=window.bills||[];
  goals=window.goals||[];
}

/* =========================
   NAV
   ========================= */
function setPage(p){
  currentPage=p;
  document.querySelectorAll('.navbtn,.mobile-nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));
  render();
}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));

/* =========================
   DASHBOARD
   ========================= */
function render(){
  const m=document.getElementById('main');
  ({dashboard:renderDashboard,transactions:renderTransactions,accounts:renderAccounts,preorders:renderPreorders,installments:renderInstallments,bills:renderBills,goals:renderGoals}[currentPage]||renderDashboard)();
}

function monthRange(){
  const d=new Date();
  return {
    start:new Date(d.getFullYear(),d.getMonth(),1).toISOString().slice(0,10),
    end:new Date(d.getFullYear(),d.getMonth()+1,0).toISOString().slice(0,10)
  };
}

function monthStats(){
  const {start,end}=monthRange();
  const t=transactions.filter(x=>x.date>=start&&x.date<=end);
  let income=0,expense=0;
  for(const x of t){
    if(x.type==='income')income+=Number(x.amount);
    if(x.type==='expense')expense+=Number(x.amount);
  }
  return {income,expense,balance:income-expense,t};
}

function accountBalance(a){
  const tx=transactions.filter(t=>t.account_id===a.id).reduce((sum,t)=>{
    if(t.type==='income')return sum+Number(t.amount);
    if(t.type==='expense')return sum-Number(t.amount);
    return sum;
  },0);
  const trOut=transfers.filter(t=>t.from_account_id===a.id).reduce((s,t)=>s-Number(t.amount||0)-Number(t.fee||0),0);
  const trIn=transfers.filter(t=>t.to_account_id===a.id).reduce((s,t)=>s+Number(t.amount||0),0);
  const recOut=receivables.filter(r=>r.account_id===a.id).reduce((s,r)=>s-Number(r.amount||0),0);
  const recIn=receivablePayments.filter(p=>p.account_id===a.id).reduce((s,p)=>s+Number(p.amount||0),0);
  return Number(a.opening_balance||0)+tx+trOut+trIn+recOut+recIn;
}

function includedAssets(){
  return accounts.filter(a=>a.include_in_total!==false).reduce((s,a)=>s+accountBalance(a),0);
}

function excludedAssets(){
  return accounts.filter(a=>a.include_in_total===false).reduce((s,a)=>s+accountBalance(a),0);
}

function receivableStats(){
  let advance=0,loan=0;
  for(const r of receivables){
    const remaining=Math.max(0,Number(r.amount||0)-Number(r.returned_amount||0));
    if(r.kind==='loan')loan+=remaining; else advance+=remaining;
  }
  return {advance,loan,total:advance+loan};
}

function committed(){
  const po=preorders.filter(x=>!['paid','cancelled'].includes(x.status)).reduce((s,x)=>s+Math.max(0,Number(x.total_amount)-Number(x.paid_amount||0)),0);
  const ins=installments.filter(x=>x.status==='active').reduce((s,x)=>s+Number(x.remaining_amount||0),0);
  const bi=bills.filter(x=>x.status!=='paid').reduce((s,x)=>s+Number(x.amount),0);
  return {po,ins,bi,total:po+ins+bi};
}

function renderDashboard(){
  const s=monthStats(),totalAssets=includedAssets(),allAssets=accounts.reduce((a,x)=>a+accountBalance(x),0),excluded=excludedAssets(),c=committed(),r=receivableStats();
  document.getElementById('main').innerHTML=`
  <div class="page-title">🐻‘s Money</div>
  <div class="page-sub">你的私人財務中控台 · ${new Date().toLocaleDateString('zh-TW',{year:'numeric',month:'long'})}</div>
  <div class="cards">
    <div class="card"><div class="metric-label">本月收入</div><div class="metric green">${money(s.income)}</div></div>
    <div class="card"><div class="metric-label">本月支出</div><div class="metric red">${money(s.expense)}</div></div>
    <div class="card"><div class="metric-label">本月結餘</div><div class="metric">${money(s.balance)}</div></div>
    <div class="card"><div class="metric-label">目前可計入總資產</div><div class="metric">${money(totalAssets)}</div><div class="small">全部帳戶 ${money(allAssets)} · 不計入 ${money(excluded)}</div></div>
  </div>
  <div class="grid2">
    <div class="card">
      <div class="section-head"><h3>⚠️ 未來待支付</h3></div>
      <div class="list">
        <div class="row"><div class="row-title">🛍️ 預購／待付款</div><div class="amount">${money(c.po)}</div></div>
        <div class="row"><div class="row-title">💳 分期剩餘</div><div class="amount">${money(c.ins)}</div></div>
        <div class="row"><div class="row-title">🧾 待繳帳單</div><div class="amount">${money(c.bi)}</div></div>
        <div class="row"><div class="row-title">承諾支出合計</div><div class="amount expense">${money(c.total)}</div></div>
        <div class="row"><div class="row-title">🧾 代墊待收回</div><div class="amount">${money(r.advance)}</div></div>
        <div class="row"><div class="row-title">💸 借款待收回</div><div class="amount">${money(r.loan)}</div></div>
      </div>
    </div>
    <div class="card">
      <div class="section-head"><h3>🎯 儲蓄目標</h3><button class="ghost" onclick="setPage('goals')">查看全部</button></div>
      ${goals.slice(0,3).map(g=>`<div style="margin:12px 0"><div style="display:flex;justify-content:space-between"><b>${esc(g.name)}</b><span class="small">${money(g.current_amount)} / ${money(g.target_amount)}</span></div><div class="progress"><div style="width:${pct(g.current_amount,g.target_amount)}%"></div></div></div>`).join('')||'<div class="small">還沒有儲蓄目標</div>'}
    </div>
  </div>
  <div class="card" style="margin-top:16px">
    <div class="section-head"><h3>🧾 最近交易</h3><button class="ghost" onclick="setPage('transactions')">查看全部</button></div>
    <div class="list">${transactions.slice(0,8).map(t=>transactionRow(t)).join('')||'<div class="small">還沒有記帳資料</div>'}</div>
  </div>`;
}

function transactionRow(t){
  return `<div class="row"><div class="row-left"><div class="row-title">${esc(t.category||'未分類')}</div><div class="small">${dateText(t.date)}${t.note?' · '+esc(t.note):''}</div></div><div class="amount ${t.type==='income'?'income':'expense'}">${t.type==='income'?'+':'-'}${money(t.amount)}</div></div>`;
}

/* =========================
   PAGES
   ========================= */
function renderTransactions(){
  const rows=[
    ...transactions.map(t=>({kind:'tx',date:t.date,created_at:t.created_at,data:t})),
    ...transfers.map(t=>({kind:'transfer',date:t.date,created_at:t.created_at,data:t}))
  ].sort((a,b)=>new Date((b.date||'')+'T00:00:00')-new Date((a.date||'')+'T00:00:00'));
  document.getElementById('main').innerHTML=`
  <div class="section-head"><div><div class="page-title">🧾 記帳</div><div class="page-sub">所有收入、支出與帳戶轉帳</div></div><button class="primary" style="width:auto;margin:0" onclick="openTransactionModal()">＋ 新增</button></div>
  <div class="actions" style="margin-bottom:14px"><button class="ghost" onclick="openTransferModal()">🔄 帳戶轉帳</button><button class="ghost" onclick="openReceivableModal('advance')">🧾 新增代墊</button><button class="ghost" onclick="openReceivableModal('loan')">💸 新增借款</button></div>
  <div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>日期</th><th>類型</th><th>分類</th><th>帳戶</th><th>金額</th><th>備註</th><th></th></tr></thead><tbody>
  ${rows.map(row=>row.kind==='transfer'?transferRow(row.data):`<tr><td>${dateText(row.data.date)}</td><td>${row.data.type==='income'?'收入':'支出'}</td><td>${esc(row.data.category||'-')}</td><td>${esc(accounts.find(a=>a.id===row.data.account_id)?.name||'-')}</td><td class="${row.data.type==='income'?'income':'expense'}">${row.data.type==='income'?'+':'-'}${money(row.data.amount)}</td><td>${esc(row.data.note||'')}</td><td><button class="danger" onclick="deleteRecord('transactions','${row.data.id}')">刪除</button></td></tr>`).join('')}
  </tbody></table></div></div>`;
}

function transferRow(t){
  const from=accounts.find(a=>a.id===t.from_account_id)?.name||'-',to=accounts.find(a=>a.id===t.to_account_id)?.name||'-';
  return `<tr><td>${dateText(t.date)}</td><td>🔄 轉帳</td><td>帳戶轉帳</td><td>${esc(from)} → ${esc(to)}</td><td>${money(t.amount)}</td><td>${esc(t.note||'')}${Number(t.fee||0)?` · 手續費 ${money(t.fee)}`:''}</td><td><button class="danger" onclick="deleteTransfer('${t.id}')">刪除</button></td></tr>`;
}


function renderAccounts(){
  const included=accounts.filter(a=>a.include_in_total!==false).reduce((s,a)=>s+accountBalance(a),0),excluded=accounts.filter(a=>a.include_in_total===false).reduce((s,a)=>s+accountBalance(a),0);
  document.getElementById('main').innerHTML=`

   MODALS / CRUD

function openModal(html){document.getElementById('modalCard').innerHTML=html;document.getElementById('modal').classList.remove('hidden')}
function closeModal(){document.getElementById('modal').classList.add('hidden')}
function selectAccounts(){return accounts.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}

function openTransactionModal(){
  if(!accounts.length){
    alert('請先到「帳戶」新增至少一個帳戶，再開始記帳。');
    setPage('accounts');
    return;
  }
  openModal(`<div class="modal-head"><h3>新增記帳</h3><button class="ghost" onclick="closeModal()">關閉</button></div><form onsubmit="saveTransaction(event)"><div class="form-grid"><div><label>類型</label><select id="tType" class="select"><option value="expense">支出</option><option value="income">收入</option></select></div><div><label>金額</label><input id="tAmount" class="input" type="number" min="0" required></div><div><label>日期</label><input id="tDate" class="input" type="date" value="${today()}" required></div><div><label>帳戶</label><select id="tAccount" class="select" required>${selectAccounts()}</select></div><div><label>分類</label><input id="tCategory" class="input" placeholder="例如 飲食、薪資"></div><div><label>備註</label><input id="tNote" class="input" placeholder="可留空"></div></div><button class="primary">儲存</button></form>`);
}

async function saveTransaction(e){
  e.preventDefault();
  const {error}=await db.from('transactions').insert({
    user_id:currentUser.id,
    type:document.getElementById('tType').value,
    amount:Number(document.getElementById('tAmount').value),
    date:document.getElementById('tDate').value,
    account_id:document.getElementById('tAccount').value,
    category:document.getElementById('tCategory').value.trim(),
    note:document.getElementById('tNote').value.trim()
  });
  if(error)return alert(error.message);
  closeModal();await loadAll();render();
}

function openAccountModal(id){
  const x=accounts.find(a=>a.id===id)||{};
  openModal(`<div class="modal-head"><h3>${id?'編輯':'新增'}帳戶</h3><button class="ghost" onclick="closeModal()">關閉</button></div><form onsubmit="saveAccount(event,'${id||''}')"><label>名稱</label><input id="aName" class="input" required placeholder="例如 現金、AII銀行" value="${esc(x.name||'')}"><label>類型</label><select id="aType" class="select"><option>現金</option><option>銀行</option><option>信用卡</option><option>其他</option></select><label>初始餘額</label><input id="aBalance" class="input" type="number" value="${x.opening_balance??0}"><label style="display:flex;gap:10px;align-items:center;color:var(--text);margin-top:16px"><input id="aInclude" type="checkbox" ${x.include_in_total===false?'':'checked'}> 計入目前總資產</label><div class="small">取消勾選後，帳戶仍會正常計算餘額，只是不會列入 Dashboard 的「目前可計入總資產」。</div><button class="primary">儲存</button></form>`);
  if(x.type)document.getElementById('aType').value=x.type;
}
async function saveAccount(e,id){
  e.preventDefault();
  const payload={user_id:currentUser.id,name:document.getElementById('aName').value.trim(),type:document.getElementById('aType').value,opening_balance:Number(document.getElementById('aBalance').value),include_in_total:document.getElementById('aInclude').checked};
  const q=id?db.from('accounts').update(payload).eq('id',id):db.from('accounts').insert(payload);
  const {error}=await q;if(error)return alert(error.message);
  closeModal();await loadAll();render();
}



function openTransferModal(){
  if(accounts.length<2){alert('至少需要兩個帳戶才能轉帳。');setPage('accounts');return;}
  openModal(`<div class="modal-head"><h3>🔄 帳戶轉帳</h3><button class="ghost" onclick="closeModal()">關閉</button></div><form onsubmit="saveTransfer(event)"><div class="form-grid"><div><label>轉出帳戶</label><select id="trFrom" class="select" required>${selectAccounts()}</select></div><div><label>轉入帳戶</label><select id="trTo" class="select" required>${selectAccounts()}</select></div><div><label>轉帳金額</label><input id="trAmount" class="input" type="number" min="0.01" step="0.01" required></div><div><label>手續費</label><input id="trFee" class="input" type="number" min="0" step="0.01" value="0"></div><div><label>日期</label><input id="trDate" class="input" type="date" value="${today()}" required></div><div><label>備註</label><input id="trNote" class="input" placeholder="例如 存錢轉入"></div></div><div class="small" style="margin-top:10px">轉帳本身不算收入／支出；只有手續費會算作支出。</div><button class="primary">確認轉帳</button></form>`);
}
async function saveTransfer(e){
  e.preventDefault();
  const from=document.getElementById('trFrom').value,to=document.getElementById('trTo').value,amount=Number(document.getElementById('trAmount').value),fee=Number(document.getElementById('trFee').value||0),date=document.getElementById('trDate').value,note=document.getElementById('trNote').value.trim();
  if(from===to)return alert('轉出與轉入帳戶不能相同。');
  const tx=fee>0?await db.from('transactions').insert({user_id:currentUser.id,type:'expense',amount:fee,date,account_id:from,category:'銀行手續費',note:note?`帳戶轉帳｜${note}`:'帳戶轉帳手續費'}).select('id').single():{data:null,error:null};
  if(tx.error)return alert(tx.error.message);
  const {error}=await db.from('transfers').insert({user_id:currentUser.id,from_account_id:from,to_account_id:to,amount,fee,date,note,fee_transaction_id:tx.data?.id||null});
  if(error){if(tx.data?.id)await db.from('transactions').delete().eq('id',tx.data.id);return alert(error.message);}
  closeModal();await loadAll();render();
}
async function deleteTransfer(id){
  if(!confirm('確定刪除這筆轉帳嗎？'))return;
  const x=transfers.find(t=>t.id===id);if(!x)return;
  if(x.fee_transaction_id)await db.from('transactions').delete().eq('id',x.fee_transaction_id);
  const {error}=await db.from('transfers').delete().eq('id',id);if(error)return alert(error.message);
  await loadAll();render();
}

function getReceivableRemaining(x){return Math.max(0,Number(x.amount||0)-Number(x.returned_amount||0));}
function renderReceivableStatus(x){const r=getReceivableRemaining(x);return r<=0?'已收回':x.returned_amount>0?'部分收回':'待收回';}

function openReceivableModal(kind='advance'){
  if(!accounts.length){alert('請先建立一個帳戶。');setPage('accounts');return;}
  const title=kind==='loan'?'💸 借款給朋友':'🧾 代墊款';
  openModal(`<div class="modal-head"><h3>${title}</h3><button class="ghost" onclick="closeModal()">關閉</button></div><form onsubmit="saveReceivable(event,'${kind}')"><div class="form-grid"><div><label>對象</label><input id="rPerson" class="input" required placeholder="例如 小明"></div><div><label>金額</label><input id="rAmount" class="input" type="number" min="0.01" step="0.01" required></div><div><label>由哪個帳戶支付</label><select id="rAccount" class="select" required>${selectAccounts()}</select></div><div><label>日期</label><input id="rDate" class="input" type="date" value="${today()}" required></div><div><label>預計收回日</label><input id="rDue" class="input" type="date"></div><div><label>${kind==='loan'?'用途':'代墊項目'}</label><input id="rPurpose" class="input" placeholder="例如 午餐、生活費"></div></div><label>備註</label><input id="rNote" class="input" placeholder="可留空"><div class="small" style="margin-top:10px">這筆錢會從帳戶餘額扣除，但不會算成支出，也不會算成收入；對方還錢時再記錄收回。</div><button class="primary">儲存</button></form>`);
}
async function saveReceivable(e,kind){
  e.preventDefault();
  const amount=Number(document.getElementById('rAmount').value),accountId=document.getElementById('rAccount').value;
  const {error}=await db.from('receivables').insert({user_id:currentUser.id,kind,person:document.getElementById('rPerson').value.trim(),amount,returned_amount:0,account_id:accountId,date:document.getElementById('rDate').value,due_date:document.getElementById('rDue').value||null,purpose:document.getElementById('rPurpose').value.trim(),note:document.getElementById('rNote').value.trim(),status:'open'});
  if(error)return alert(error.message);closeModal();await loadAll();render();
}
function openReceivableDetail(id){
  const x=receivables.find(r=>r.id===id);if(!x)return;
  const payments=receivablePayments.filter(p=>p.receivable_id===id);
  const remain=getReceivableRemaining(x);
  const title=x.kind==='loan'?'💸 借款':'🧾 代墊款';
  openModal(`<div class="modal-head"><div><h3>${title}｜${esc(x.person)}</h3><div class="small">原始 ${money(x.amount)} · 已收回 ${money(x.returned_amount)} · 尚欠 ${money(remain)}</div></div><button class="ghost" onclick="closeModal()">關閉</button></div><div class="card" style="margin-top:14px"><div class="small">${esc(x.purpose||'')}${x.due_date?' · 預計 '+dateText(x.due_date):''}</div><div style="margin-top:8px">狀態：<span class="pill ${remain<=0?'ok':'warn'}">${renderReceivableStatus(x)}</span></div></div><div class="table-wrap" style="margin-top:14px"><table class="table"><thead><tr><th>日期</th><th>收回金額</th><th>帳戶</th><th>備註</th></tr></thead><tbody>${payments.map(p=>`<tr><td>${dateText(p.date)}</td><td>${money(p.amount)}</td><td>${esc(accounts.find(a=>a.id===p.account_id)?.name||'-')}</td><td>${esc(p.note||'')}</td></tr>`).join('')||'<tr><td colspan="4">尚未收回</td></tr>'}</tbody></table></div><div class="actions" style="margin-top:14px">${remain>0?`<button class="primary" style="width:auto;margin:0" onclick="closeModal();openReceivablePaymentModal('${id}')">💰 記錄收回</button>`:''}<button class="ghost" onclick="closeModal();deleteReceivable('${id}')">刪除</button></div>`);
}
function openReceivablePaymentModal(id){
  const x=receivables.find(r=>r.id===id);if(!x)return;
  openModal(`<div class="modal-head"><h3>💰 收回款項</h3><button class="ghost" onclick="closeModal()">關閉</button></div><form onsubmit="saveReceivablePayment(event,'${id}')"><div class="form-grid"><div><label>收回金額</label><input id="rpAmount" class="input" type="number" min="0.01" max="${getReceivableRemaining(x)}" step="0.01" value="${getReceivableRemaining(x)}" required></div><div><label>收到哪個帳戶</label><select id="rpAccount" class="select" required>${selectAccounts()}</select></div><div><label>日期</label><input id="rpDate" class="input" type="date" value="${today()}" required></div><div><label>備註</label><input id="rpNote" class="input" placeholder="可留空"></div></div><button class="primary">確認收回</button></form>`);
}
async function saveReceivablePayment(e,id){
  e.preventDefault();
  const x=receivables.find(r=>r.id===id),amount=Number(document.getElementById('rpAmount').value);
  if(amount<=0||amount>getReceivableRemaining(x))return alert('收回金額超過尚欠金額。');
  const pay=await db.from('receivable_payments').insert({user_id:currentUser.id,receivable_id:id,amount,account_id:document.getElementById('rpAccount').value,date:document.getElementById('rpDate').value,note:document.getElementById('rpNote').value.trim()}).select('id').single();
  if(pay.error)return alert(pay.error.message);
  const next=Number(x.returned_amount||0)+amount;
  const {error:up}=await db.from('receivables').update({returned_amount:next,status:next>=Number(x.amount)?'completed':'partial'}).eq('id',id);
  if(up){await db.from('receivable_payments').delete().eq('id',pay.data.id);return alert(up.message);}
  closeModal();await loadAll();render();
}
async function deleteReceivable(id){
  if(!confirm('確定刪除這筆紀錄嗎？'))return;
  const {error}=await db.from('receivables').delete().eq('id',id);if(error)return alert(error.message);await loadAll();render();

function openInstallmentModal(id){
  const x=installments.find(a=>a.id===id)||{};
  openModal(`<div class="modal-head"><h3>${id?'編輯':'新增'}分期</h3><button class="ghost" onclick="closeModal()">關閉</button></div><form onsubmit="saveInstallment(event,'${id||''}')"><label>名稱</label><input id="iName" class="input" required value="${esc(x.name||'')}"><div class="form-grid"><div><label>總金額</label><input id="iTotal" class="input" type="number" min="0" required value="${x.total_amount||''}"></div><div><label>總期數</label><input id="iPeriods" class="input" type="number" min="1" required value="${x.total_periods||''}"></div><div><label>每期金額</label><input id="iPeriodAmount" class="input" type="number" min="0" required value="${x.period_amount||''}"></div><div><label>已繳期數（歷史補登）</label><input id="iPaidPeriods" class="input" type="number" min="0" required value="${x.paid_periods||0}"></div><div><label>第一期日期</label><input id="iStart" class="input" type="date" value="${x.start_date||today()}"></div><div><label>每月幾號扣款</label><input id="iDay" class="input" type="number" min="1" max="28" value="${x.due_day||5}"></div></div><p class="small">💡 歷史已繳期數只代表「以前已經繳掉幾期」，不會自動產生本月支出。之後每次按「繳下一期」，只會更新這筆分期的進度。</p><button class="primary">儲存</button></form>`);
}
async function saveInstallment(e,id){
  e.preventDefault();
  const total=Number(document.getElementById('iTotal').value),periods=Number(document.getElementById('iPeriods').value),paid=Math.min(periods,Math.max(0,Number(document.getElementById('iPaidPeriods').value)));
  const periodAmount=Number(document.getElementById('iPeriodAmount').value);
  const payload={user_id:currentUser.id,name:document.getElementById('iName').value.trim(),total_amount:total,total_periods:periods,period_amount:periodAmount,paid_periods:paid,remaining_amount:Math.max(0,total-paid*periodAmount),start_date:document.getElementById('iStart').value||null,due_day:Number(document.getElementById('iDay').value),status:paid>=periods?'completed':'active'};
  const q=id?db.from('installments').update(payload).eq('id',id):db.from('installments').insert(payload);
  const {error}=await q;if(error)return alert(error.message);closeModal();await loadAll();render();
}
function addMonths(base,n,day){
  if(!base)return null;
  const d=new Date(base+'T00:00:00');
  d.setMonth(d.getMonth()+n);
  d.setDate(Math.min(day||d.getDate(),28));
  return d.toISOString().slice(0,10);
}

function getInstallmentPayments(id){
  return installmentPayments.filter(p=>p.installment_id===id).sort((a,b)=>Number(a.period_number)-Number(b.period_number));
}

function openPaymentModal(id){
  const x=installments.find(a=>a.id===id);if(!x)return;
  const paid=Number(x.paid_periods||0),total=Number(x.total_periods||0);
  if(paid>=total){alert('這筆分期已全部繳清。');return;}
  if(!accounts.length){alert('請先到「帳戶」新增至少一個付款帳戶。');setPage('accounts');return;}
  const next=paid+1;
  openModal(`<div class="modal-head"><div><h3>💰 紀錄第 ${next} 期付款</h3><div class="small">${esc(x.name)} · ${money(x.period_amount)}</div></div><button class="ghost" onclick="closeModal()">關閉</button></div>
  <form onsubmit="saveInstallmentPayment(event,'${id}',${next})">
    <div class="form-grid">
      <div><label>付款日期</label><input id="payDate" class="input" type="date" value="${today()}" required></div>
      <div><label>付款金額</label><input id="payAmount" class="input" type="number" min="0" value="${x.period_amount}" required></div>
      <div><label>付款帳戶</label><select id="payAccount" class="select" required>${selectAccounts()}</select></div>
      <div><label>備註</label><input id="payNote" class="input" placeholder="例如 10月分期"></div>
    </div>
    <label>📸 繳費明細</label>
    <input id="payReceipt" class="input" type="file" accept="image/jpeg,image/png,image/webp">
    <div class="small">可上傳 JPG、PNG、WebP，單張最大 5 MB。</div>
    <button class="primary" id="paySubmit">✓ 儲存付款紀錄</button>
  </form>`);
}

async function saveInstallmentPayment(e,id,periodNumber){
  e.preventDefault();
  const btn=document.getElementById('paySubmit');btn.disabled=true;btn.textContent='儲存中…';
  const x=installments.find(a=>a.id===id);if(!x)return;
  const amount=Number(document.getElementById('payAmount').value);
  const date=document.getElementById('payDate').value;
  const accountId=document.getElementById('payAccount').value;
  const note=document.getElementById('payNote').value.trim();
  const file=document.getElementById('payReceipt').files[0];
  let receiptPath=null;
  try{
    if(file){
      if(file.size>5*1024*1024)throw new Error('圖片超過 5 MB，請換一張較小的圖片。');
      if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw new Error('只允許 JPG、PNG、WebP 圖片。');
      const ext=file.type==='image/jpeg'?'jpg':file.type.split('/')[1];
      receiptPath=`${currentUser.id}/${id}/${periodNumber}-${Date.now()}.${ext}`;
      const up=await db.storage.from('payment-receipts').upload(receiptPath,file,{contentType:file.type,upsert:false});
      if(up.error)throw up.error;
    }

    const tx=await db.from('transactions').insert({
      user_id:currentUser.id,type:'expense',amount,date,account_id:accountId,
      category:'分期付款',note:note||`${x.name}｜第${periodNumber}期`
    }).select('id').single();
    if(tx.error)throw tx.error;

    let pay=await db.from('installment_payments').insert({
      user_id:currentUser.id,installment_id:id,period_number:periodNumber,
      payment_date:date,amount,account_id:accountId,note,receipt_path:receiptPath,
      transaction_id:tx.data.id
    });

    // 如果你目前尚未加入 transaction_id 欄位，先用不含該欄位的版本寫入，
    // 這樣付款功能仍可正常使用。之後再補欄位即可。
    if(pay.error && /transaction_id|column.*does not exist/i.test(pay.error.message||'')){
      pay=await db.from('installment_payments').insert({
        user_id:currentUser.id,installment_id:id,period_number:periodNumber,
        payment_date:date,amount,account_id:accountId,note,receipt_path:receiptPath
      });
    }

    if(pay.error){
      await db.from('transactions').delete().eq('id',tx.data.id);
      if(receiptPath)await db.storage.from('payment-receipts').remove([receiptPath]);
      throw pay.error;
    }

    const nextPaid=periodNumber;
    const upd=await db.from('installments').update({
      paid_periods:nextPaid,
      remaining_amount:Math.max(0,Number(x.total_amount)-nextPaid*Number(x.period_amount)),
      status:nextPaid>=Number(x.total_periods)?'completed':'active'
    }).eq('id',id);
    if(upd.error)throw upd.error;

    closeModal();await loadAll();render();
  }catch(err){
    console.error(err);alert(err.message||'付款紀錄儲存失敗，請再試一次。');
    btn.disabled=false;btn.textContent='✓ 儲存付款紀錄';
  }
}

async function undoInstallmentPaid(id){
  const x=installments.find(a=>a.id===id);if(!x)return;
  const paid=Number(x.paid_periods||0);if(paid<=0)return;
  const payment=getInstallmentPayments(id).find(p=>Number(p.period_number)===paid);
  if(!payment){alert('找不到這一期的付款紀錄，請不要直接撤銷，避免資料不同步。');return;}
  if(!confirm(`確定把第 ${paid} 期改回「待繳」嗎？\n這會同時刪除這一期的付款紀錄與記帳。`))return;
  const {error:delPay}=await db.from('installment_payments').delete().eq('id',payment.id);
  if(delPay)return alert(delPay.message);
  if(payment.transaction_id){
    const {error:delTx}=await db.from('transactions').delete().eq('id',payment.transaction_id);
    if(delTx)return alert(delTx.message);
  }else{
    // 尚未建立 transaction_id 欄位時，依付款紀錄找對應的分期支出。
    const txNote=payment.note||`${x.name}｜第${paid}期`;
    const {data:txRows}=await db.from('transactions').select('id,created_at').eq('user_id',currentUser.id).eq('type','expense').eq('amount',payment.amount).eq('date',payment.payment_date).eq('account_id',payment.account_id).eq('category','分期付款').eq('note',txNote).order('created_at',{ascending:false}).limit(1);
    if(txRows?.[0]){
      const {error:delTx}=await db.from('transactions').delete().eq('id',txRows[0].id);
      if(delTx)return alert(delTx.message);
    }
  }
  if(payment.receipt_path)await db.storage.from('payment-receipts').remove([payment.receipt_path]);
  const nextPaid=paid-1;
  const {error}=await db.from('installments').update({
    paid_periods:nextPaid,
    remaining_amount:Math.max(0,Number(x.total_amount)-nextPaid*Number(x.period_amount)),
    status:'active'
  }).eq('id',id);
  if(error)return alert(error.message);
  await loadAll();render();
}

async function viewReceipt(path){
  if(!path)return;
  const {data,error}=await db.storage.from('payment-receipts').createSignedUrl(path,300);
  if(error)return alert(error.message);
  openModal(`<div class="modal-head"><h3>📸 繳費明細</h3><button class="ghost" onclick="closeModal()">關閉</button></div><img src="${data.signedUrl}" style="width:100%;max-height:70vh;object-fit:contain;border-radius:14px;background:#eee7df" alt="繳費明細">`);
}

function openInstallmentDetail(id){
  const x=installments.find(a=>a.id===id);if(!x)return;
  const paid=Number(x.paid_periods||0),payments=getInstallmentPayments(id);
  let rows='';
  for(let n=1;n<=x.total_periods;n++){
    const p=payments.find(v=>Number(v.period_number)===n);
    // 舊版分期只有 paid_periods，沒有逐期 payment record。
    // 因此 n <= paid 時仍要視為已繳，並標示為歷史補登。
    const isPaid=!!p || n<=paid;
    const dueDate=addMonths(x.start_date,n-1,x.due_day);
    const statusHtml=p?`<span class="pill ok">✓ 已繳</span><div class="small">實際 ${dateText(p.payment_date)}</div>`:isPaid?`<span class="pill ok">✓ 已繳</span><div class="small">歷史補登</div>`:'<span class="pill warn">待繳</span>';
    const receiptHtml=p?.receipt_path?`<button class="ghost" onclick="viewReceipt('${p.receipt_path}')">📸 查看</button>`:'-';
    rows+=`<tr><td>第 ${n} 期</td><td>${dateText(dueDate)}</td><td>${money(p?.amount??x.period_amount)}</td><td>${statusHtml}</td><td>${receiptHtml}</td></tr>`;
  }
  openModal(`<div class="modal-head"><div><h3 style="margin:0">${esc(x.name)}</h3><div class="small">${paid}/${x.total_periods} 期 · 剩餘 ${money(x.remaining_amount)}</div></div><button class="ghost" onclick="closeModal()">關閉</button></div><div class="table-wrap" style="margin-top:14px"><table class="table"><thead><tr><th>期數</th><th>預定日</th><th>金額</th><th>狀態</th><th>明細</th></tr></thead><tbody>${rows}</tbody></table></div><div class="actions" style="margin-top:14px">${paid<x.total_periods?`<button class="primary" style="width:auto;margin:0" onclick="closeModal();openPaymentModal('${id}')">💰 紀錄下一期付款</button>`:''}${paid>0?`<button class="ghost" onclick="closeModal();undoInstallmentPaid('${id}')">↩ 撤銷最後一期</button>`:''}<button class="ghost" onclick="closeModal();openInstallmentModal('${id}')">修改分期</button></div>`);
}

function openBillModal(){
  openModal(`<div class="modal-head"><h3>新增固定繳費</h3><button class="ghost" onclick="closeModal()">關閉</button></div><form onsubmit="saveBill(event)"><label>名稱</label><input id="bName" class="input" required placeholder="例如 電話費"><div class="form-grid"><div><label>每月金額</label><input id="bAmount" class="input" type="number" min="0" required></div><div><label>繳費日</label><input id="bDay" class="input" type="number" min="1" max="31" value="5"></div></div><button class="primary">儲存</button></form>`);
}
async function saveBill(e){
  e.preventDefault();
  const {error}=await db.from('bills').insert({user_id:currentUser.id,name:document.getElementById('bName').value.trim(),amount:Number(document.getElementById('bAmount').value),due_day:Number(document.getElementById('bDay').value),status:'unpaid'});
  if(error)return alert(error.message);closeModal();await loadAll();render();
}
async function toggleBill(id){
  const x=bills.find(a=>a.id===id),next=x.status==='paid'?'unpaid':'paid';
  const {error}=await db.from('bills').update({status:next}).eq('id',id);
  if(error)return alert(error.message);await loadAll();render();
}
function openGoalModal(){
  openModal(`<div class="modal-head"><h3>新增儲蓄目標</h3><button class="ghost" onclick="closeModal()">關閉</button></div><form onsubmit="saveGoal(event)"><label>目標名稱</label><input id="gName" class="input" required placeholder="例如 緊急預備金"><div class="form-grid"><div><label>目標金額</label><input id="gTarget" class="input" type="number" min="0" required></div><div><label>目前已存</label><input id="gCurrent" class="input" type="number" min="0" value="0"></div><div><label>目標日期</label><input id="gDate" class="input" type="date"></div></div><button class="primary">儲存</button></form>`);
}
async function saveGoal(e){
  e.preventDefault();
  const {error}=await db.from('goals').insert({user_id:currentUser.id,name:document.getElementById('gName').value.trim(),target_amount:Number(document.getElementById('gTarget').value),current_amount:Number(document.getElementById('gCurrent').value||0),target_date:document.getElementById('gDate').value||null});
  if(error)return alert(error.message);closeModal();await loadAll();render();
}
async function addGoalMoney(id){
  const x=goals.find(a=>a.id===id),n=prompt(`目前 ${money(x.current_amount)}\n這次要增加多少？`);
  if(n===null)return;
  const v=Number(n);
  if(!Number.isFinite(v)||v<0)return alert('請輸入正確金額');
  const {error}=await db.from('goals').update({current_amount:Number(x.current_amount)+v}).eq('id',id);
  if(error)return alert(error.message);await loadAll();render();
}
async function deleteRecord(table,id){
  if(!confirm('確定要刪除嗎？'))return;
  const {error}=await db.from(table).delete().eq('id',id);
  if(error)return alert(error.message);await loadAll();render();
}
function quickAdd(){
  if(currentPage==='dashboard'||currentPage==='transactions')openTransactionModal();
  else if(currentPage==='preorders')openPreorderModal();
  else if(currentPage==='installments')openInstallmentModal();
  else if(currentPage==='bills')openBillModal();
  else if(currentPage==='goals')openGoalModal();
  else openTransactionModal();
}

init();
</script>
